<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Good page</title>
<style>
:root{--bg:#ffffff;--fg:#1d1d1f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1d1f;--fg:#f5f5f7}}
:root[data-theme="dark"]{--bg:#1d1d1f;--fg:#f5f5f7}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif}
</style>
</head>
<body>
<h1>Good page</h1>
<label>Rate <input id="rate" type="number" min="1" max="10" value="2"></label>
<p>Half of it: <output id="half">1</output></p>
<script>
const rate = document.getElementById("rate"), half = document.getElementById("half");
rate.addEventListener("input", () => { const v = Number(rate.value); half.textContent = rate.value === "" ? "–" : String(v / 2); });
const mc = document.modelContext || navigator.modelContext;
if (mc) for (const name of ["get_metadata", "get_state", "set_rate"]) mc.registerTool({ name, description: name, execute: async () => ({}) });
</script>
</body>
</html>
