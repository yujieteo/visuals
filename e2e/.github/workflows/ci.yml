name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      site_ref:
        description: yujieteo/site branch, tag or commit to test
        default: main
  schedule:
    # Daily, so a visual that changes on the site is retested without a change here.
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Type check and harness tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:harness
      - name: FINDINGS.md matches the manifests
        run: node scripts/findings.js --check

  e2e:
    name: E2E ${{ matrix.project }} ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Each browser project runs in its own jobs, and the visuals split into
        # batches within a project, so wall time stays flat as visuals grow:
        # add a shard here when a job nears ten minutes.
        project: [chromium-desktop, firefox-desktop, webkit-desktop, chromium-mobile, webkit-mobile]
        shard: [1/2, 2/2]
    env:
      E2E_PROJECTS: ${{ matrix.project }}
      E2E_SHARD: ${{ matrix.shard }}
      E2E_RESULTS: results
      E2E_CONCURRENCY: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch yujieteo/site and yujieteo/visuals
        run: node scripts/fetch-targets.js "${{ inputs.site_ref || 'main' }}"
      - name: Install the browser
        run: npx playwright install --with-deps "${MATRIX_PROJECT%%-*}"
        env:
          MATRIX_PROJECT: ${{ matrix.project }}
      - name: Baseline for every visual
        run: npm run test:baseline
      - name: Full checks for the representative visuals
        if: matrix.shard == '1/2'
        run: npm run test:full
      - name: Timings
        if: always()
        run: node scripts/timings.js results >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.project }}-${{ strategy.job-index }}
          path: results/
          if-no-files-found: ignore

  timings:
    name: Timings across the matrix
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results
      - run: node scripts/timings.js $(find results -name '*.jsonl') >> "$GITHUB_STEP_SUMMARY"
