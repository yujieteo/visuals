# The Rust visuals: each is a crate in its own viz/<slug>/ folder, built to WebAssembly and sealed into
# that folder's index.html. look/ holds the site's look (theme, fonts, header) that every one shares.
[workspace]
resolver = "3"
members = ["look", "viz/beamdiag"]

[workspace.package]
edition = "2024"
license = "MIT"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = false
strip = true
