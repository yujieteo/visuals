<p class="lede">{{lede}}</p>
<section class="lab" aria-label="Laboratory">
<div>
<figure class="card">
<figcaption class="label">Displacement over time</figcaption>
<svg id="chart" class="chart" viewBox="0 0 640 260" role="img" aria-label="Displacement x against time t, with its envelope"></svg>
</figure>
{{#three_d}}
<figure class="card">
<figcaption class="label">Phase path in 3D: time, displacement, velocity. Drag, or focus it and press the arrow keys, to turn it. <span id="camera" class="num"></span></figcaption>
<svg id="space" class="chart" viewBox="0 0 360 260" role="img" tabindex="0" aria-label="The phase path in three dimensions; arrow keys turn the camera"></svg>
</figure>
{{/three_d}}
{{#mathjax}}
<div id="formula" class="formula" aria-live="polite"></div>
{{/mathjax}}
{{^mathjax}}
<p id="formula" class="formula" aria-live="polite"></p>
{{/mathjax}}
</div>
<div class="card">
<h2>Inputs</h2>
<div class="field">
<label for="amplitude">Amplitude a: <output id="amplitude-value" for="amplitude"></output></label>
<input id="amplitude" type="range" data-field="amplitude" min="0.5" max="3" step="0.1">
</div>
<div class="field">
<label for="damping">Damping ratio ζ: <output id="damping-value" for="damping"></output></label>
<input id="damping" type="range" data-field="damping" min="0" max="1" step="0.05">
</div>
<div class="field">
<label><input id="envelope" type="checkbox" data-field="envelope"> Show the envelope</label>
</div>
<p class="label">Examples</p>
<p class="examples">
<button type="button" data-example="undamped">No damping</button>
<button type="button" data-example="light">Light damping</button>
<button type="button" data-example="heavy">Heavy damping</button>
</p>
<h2>Results</h2>
<dl class="readout">
<dt>After one cycle</dt><dd id="after-one-cycle"></dd>
<dt>Decay per cycle</dt><dd id="decay-per-cycle"></dd>
<dt>Below 10% after</dt><dd id="ten-percent"></dd>
</dl>
</div>
</section>
