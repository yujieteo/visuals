<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>@@TITLE@@</title>
<meta name="description" content="@@DESCRIPTION@@">
<link rel="canonical" href="https://teoyujie.org/visuals/@@SLUG@@/">
<meta property="og:title" content="@@TITLE@@">
<meta property="og:description" content="@@DESCRIPTION@@">
<meta property="og:type" content="website">
<meta property="og:url" content="https://teoyujie.org/visuals/@@SLUG@@/">
@@THEME_SCRIPT@@
<style>
@@STYLE_TOKENS@@
@@KIT_CSS@@
@@STYLE@@
</style>
</head>
<body>
<main>
<header>
<p class="eyebrow"><a href="../../visuals.html">Visuals</a><span>@@SUBJECT@@</span><span>Works offline</span></p>
<h1>@@TITLE@@</h1>
</header>
<noscript><p class="callout">The controls, the shareable link and the exports need JavaScript. The text and the record below stay readable without it.</p></noscript>
<div class="toolbar no-print" role="toolbar" aria-label="View and exports">
<button type="button" id="reset">Reset</button>
<button type="button" id="open-palette" aria-keyshortcuts="Control+K Meta+K">Commands (Ctrl+K)</button>
<button type="button" id="save-json">Save view JSON</button>
<label class="btn" for="load-json">Load view JSON</label>
<input type="file" id="load-json" class="visually-hidden" accept="application/json,.json">
<button type="button" id="copy-markdown">Copy Markdown record</button>
<button type="button" id="save-markdown">Save Markdown record</button>
<button type="button" id="save-beamdswitch">Save beamdswitch deck</button>
<button type="button" id="copy-beamdswitch">Copy deck</button>
</div>
<p id="notice" class="callout" role="status" aria-live="polite"></p>
<p id="export-status" class="note" role="status" aria-live="polite"></p>
@@BODY@@
@@LICENCES@@
</main>
<dialog id="palette" aria-label="Commands">
<label class="label" for="palette-input">Command</label>
<input id="palette-input" type="text" role="combobox" aria-controls="palette-list" aria-expanded="true" autocomplete="off">
<ul id="palette-list" role="listbox" aria-label="Matching commands"></ul>
</dialog>
@@SCRIPTS@@
</body>
</html>
