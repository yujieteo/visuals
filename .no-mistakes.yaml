# Per-repo no-mistakes overrides.
#
# Pin the Test step to what .github/workflows/ci.yml runs, scoped the same way: the repository-wide
# check and the shared tooling's tests always, and each visual's own checks only for the visuals the
# branch changes against origin/main (every visual when shared tooling changed). Everything here is
# stdlib Python and node --test: no install step, no network, no browser, so the type check (npm ci)
# is left to CI. no-mistakes honours commands from the default-branch copy of this file only, so
# changes take effect once merged to main.
commands:
  test: >-
    python3 scripts/check_repo.py &&
    python3 -m unittest discover -s tests -p 'test_*.py' &&
    node --test tests/*.test.mjs &&
    python3 scripts/check.py --changed

test:
  instructions: |
    The configured commands.test suite (mirroring CI) is the test. Do not
    download TTS models or other weights, and do not drive a real browser.
