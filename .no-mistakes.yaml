# Per-repo no-mistakes overrides.
#
# Pin the Test step to exactly what .github/workflows/verify.yml runs, so the
# gate tests deterministically instead of handing testing to an agent.
# Everything here is stdlib Python and node --test: no install step, no network,
# no browser. no-mistakes honours commands from the default-branch copy of this
# file only, so changes take effect once merged to main.
commands:
  test: >-
    for builder in scripts/build*.py; do python3 "$builder" --verify || exit 1; done &&
    python3 -m unittest discover -s tests -p 'test_*.py' &&
    node --test tests/*.test.mjs

test:
  instructions: |
    The configured commands.test suite (mirroring CI) is the test. Do not
    download TTS models or other weights, and do not drive a real browser.
