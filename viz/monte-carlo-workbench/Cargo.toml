[package]
name = "monte-carlo-workbench"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The Monte Carlo Probability Workbench's data builder: raw.json, the catalogue of its 12 data files"

# A crate of its own, not a member of any workspace above it.
[workspace]

[dependencies]
# preserve_order keeps the keys of each object in file order, as a Python dict does. arbitrary_precision keeps
# the literal of each number, so an integer stays an integer of any size and a float is parsed once, as
# Python's json.loads does.
serde_json = { version = "=1.0.145", features = ["preserve_order", "arbitrary_precision"] }

[profile.release]
debug = false
