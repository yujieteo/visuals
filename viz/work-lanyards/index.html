<script id="lanyard-model">
/* The model: no DOM, network or clock. Filters, scores and sorts the snapshot's items. */
(function (root, factory) {
  const api = factory();
  if (typeof module === "object" && module.exports) module.exports = api;
  else root.Lanyards = api;
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";
  /** @typedef {{id:string,name:string,listing_title:string,brand:string,shop:string,url:string,price_sgd:number|null,was_sgd:number|null,deal:string,shipping:string,material:string,width:string,features:string[],colours:string[],rating:number|null,reviews:number,pros:string[],cons:string[],quote:string,image:string,image_alt:string}} Item */
  /** @typedef {{retrieved:string,source:string,notes:string,items:Item[]}} Snapshot */
  /** @typedef {{sort?:string,maxPrice?:number|null,minRating?:number,minReviews?:number,feature?:string,shop?:string}} Query */

  /** Best value: rating × log10(1 + reviews) ÷ price; 0 when price or rating is missing. @param {Item} it */
  function value(it) {
    if (!it.price_sgd || !it.rating) return 0;
    return (it.rating * Math.log10(1 + it.reviews)) / it.price_sgd;
  }
  /** @param {Item[]} items @param {Query} q */
  function filter(items, q) {
    return items.filter((it) =>
      (q.maxPrice == null || (it.price_sgd != null && it.price_sgd <= q.maxPrice)) &&
      (it.rating ?? 0) >= (q.minRating || 0) &&
      it.reviews >= (q.minReviews || 0) &&
      (!q.feature || it.features.includes(q.feature)) &&
      (!q.shop || it.shop === q.shop));
  }
  /** @type {Record<string,(a:Item,b:Item)=>number>} */
  const ORDER = {
    value: (a, b) => value(b) - value(a),
    price: (a, b) => (a.price_sgd ?? Infinity) - (b.price_sgd ?? Infinity),
    rating: (a, b) => (b.rating ?? 0) - (a.rating ?? 0) || b.reviews - a.reviews,
    reviews: (a, b) => b.reviews - a.reviews,
  };
  /** @param {Item[]} items @param {string} key */
  function sort(items, key) {
    return items.slice().sort(ORDER[key] || ORDER.value);
  }
  /** @param {Item[]} items @param {Query} q */
  function view(items, q) { return sort(filter(items, q), q.sort || "value"); }
  /** Distinct values, sorted. @param {Item[]} items @param {(it:Item)=>string[]} pick */
  function distinct(items, pick) { return [...new Set(items.flatMap(pick))].sort(); }
  /** @param {number|null} n */
  function sgd(n) { return n == null ? "" : "S$" + n.toFixed(2); }
  return { value, filter, sort, view, distinct, sgd };
});
</script>
<script id="lanyard-ui">
(function () {
  "use strict";
  const $ = (/** @type {string} */ id) => /** @type {HTMLElement} */ (document.getElementById(id));
  /** @type {{retrieved:string,source:string,notes:string,items:Parameters<typeof Lanyards.value>[0][]}} */
  const data = JSON.parse($("lanyard-data").textContent || "{}");
  const M = Lanyards;
  const items = data.items;
  $("asof").textContent = `Prices as of ${data.retrieved}; check the shop before buying, as prices and deals change.`;
  $("source").textContent = `Source: ${data.source}. ${data.notes}`;
  /** @param {string} id @param {string[]} values */
  const fill = (id, values) => { for (const v of values) $(id).append(new Option(v, v)); };
  fill("feature", M.distinct(items, (it) => it.features));
  fill("shop", M.distinct(items, (it) => [it.shop]));
  /** @param {string} tag @param {string} [cls] @param {string} [text] */
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const val = (/** @type {string} */ id) => /** @type {HTMLInputElement} */ ($(id)).value;
  function render() {
    const mp = val("maxPrice");
    const list = M.view(items, { sort: val("sort"), maxPrice: mp === "" ? null : Number(mp), minRating: Number(val("minRating")), minReviews: Number(val("minReviews")), feature: val("feature"), shop: val("shop") });
    $("count").textContent = `${list.length} of ${items.length} lanyards`;
    const grid = $("grid");
    grid.replaceChildren();
    list.forEach((it, i) => {
      const card = el("article", "card");
      const pic = el("div", "pic");
      const img = /** @type {HTMLImageElement} */ (el("img"));
      img.src = it.image; img.alt = it.image_alt || it.name; img.loading = "lazy"; img.referrerPolicy = "no-referrer";
      img.onerror = () => img.replaceWith(el("div", "ph", `${it.name} (image unavailable)`));
      pic.append(img);
      if (val("sort") === "value") pic.append(el("span", "rank", `#${i + 1} value`));
      const body = el("div", "body");
      body.append(el("h2", "", it.name));
      const price = el("div", "price", M.sgd(it.price_sgd));
      if (it.was_sgd) { const w = el("s", "meta", " " + M.sgd(it.was_sgd)); price.append(w); }
      body.append(price);
      if (it.deal) body.append(el("div", "deal", it.deal));
      body.append(el("div", "meta", `★ ${it.rating ?? "–"} · ${it.reviews.toLocaleString("en-SG")} ratings · ${it.brand}`));
      body.append(el("div", "meta", [it.material, it.width && `width ${it.width}`, it.shipping].filter(Boolean).join(" · ")));
      const chips = el("div", "chips");
      for (const f of it.features) chips.append(el("span", "chip", f));
      body.append(chips);
      if (it.colours.length) body.append(el("div", "meta", "Colours: " + it.colours.slice(0, 6).join(", ") + (it.colours.length > 6 ? "…" : "")));
      const rev = el("ul", "rev");
      for (const p of it.pros) rev.append(el("li", "", "+ " + p));
      for (const c of it.cons) rev.append(el("li", "con", "− " + c));
      body.append(el("span", "label", "What reviewers say"), rev);
      if (it.quote) body.append(el("q", "", it.quote));
      const buy = /** @type {HTMLAnchorElement} */ (el("a", "buy", `Buy at ${it.shop}`));
      buy.href = it.url; buy.target = "_blank"; buy.rel = "noopener noreferrer";
      body.append(buy);
      card.append(pic, body);
      grid.append(card);
    });
  }
  for (const id of ["sort", "maxPrice", "minRating", "minReviews", "feature", "shop"]) $(id).addEventListener("input", render);
  render();
  /* Read-only WebMCP tools, when the browser offers them. */
  const mc = document.modelContext || navigator.modelContext;
  /** @param {unknown} v */
  const out = (v) => ({ content: [{ type: "text", text: JSON.stringify(v) }] });
  if (mc) {
    mc.registerTool({ name: "get_metadata", description: "The snapshot's retrieval date, source and notes.", annotations: { readOnlyHint: true }, execute: () => out({ retrieved: data.retrieved, source: data.source, notes: data.notes, count: items.length }) });
    mc.registerTool({ name: "list_lanyards", description: "Lanyards sorted (value, price, rating, reviews) and filtered by maxPrice, minRating, minReviews, feature and shop.", inputSchema: { type: "object", properties: { sort: { type: "string", enum: ["value", "price", "rating", "reviews"] }, maxPrice: { type: "number" }, minRating: { type: "number" }, minReviews: { type: "number" }, feature: { type: "string" }, shop: { type: "string" } } }, annotations: { readOnlyHint: true }, execute: (q) => out(M.view(items, q || {}).map((it) => ({ id: it.id, name: it.name, price_sgd: it.price_sgd, rating: it.rating, reviews: it.reviews, value: Number(M.value(it).toFixed(3)), url: it.url }))) });
    mc.registerTool({ name: "get_lanyard", description: "One lanyard's full record by id.", inputSchema: { type: "object", properties: { id: { type: "string" } }, required: ["id"] }, annotations: { readOnlyHint: true }, execute: (q) => out(items.find((it) => it.id === q.id) || null) });
  }
})();
</script>
