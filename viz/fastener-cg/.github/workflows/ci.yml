# CI for the standalone fastener-cg repository: this is where the visualisation and its tests develop.
# yujieteo/site carries a port of the page files (visuals/fastener-cg/) and runs none of these tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node build.mjs --check
      - name: Start headless Chrome for tests/fastener-cg-browser.test.mjs
        run: |
          google-chrome --headless=new --remote-debugging-port=9228 '--remote-allow-origins=*' \
            --no-sandbox --disable-gpu --user-data-dir="$RUNNER_TEMP/chrome" about:blank &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:9228/json/version && break; sleep 0.5; done
      - run: node --test 'tests/*.test.{mjs,cjs}'
        env:
          FASTENER_CG_BROWSER_URL: http://127.0.0.1:9228
