# CI for Markdown Explorer. This repository is where md-explorer and its tests develop; the site's
# visuals/md-explorer/ is a port of the page files and runs none of these tests. There is no build
# script and no Python test, so the one step runs every tests/*.test.mjs and tests/*.test.cjs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test 'tests/*.test.{mjs,cjs}'
