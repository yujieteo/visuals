<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src https: data:; base-uri 'none'; form-action 'none'">
<link rel="icon" href="data:,">
<meta name="description" content="Paste standard markdown and explore it offline: tabs per file, a section tree, cross-tab links and backlinks, #tags and Ctrl/Cmd+K search.">
<title>Markdown Explorer</title>
<script id="site-theme">try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
:root{--bg:#fff;--fg:#1d1d1f;--muted:#6e6e73;--faint:#a1a1a6;--surface:#f5f5f7;--border:#d2d2d7;--control:#86868b;--grid:#e8e8ed;--focus:#0071e3;--link:#0066cc;--tag:#1a7f64;--tagbg:rgba(26,127,100,.1);--bad:#c4261d;--hl:rgba(255,204,0,.45);--sel:rgba(0,113,227,.1);--code:#f5f5f7;--shadow:0 10px 40px rgba(0,0,0,.18);--sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;--r:.5rem;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1d1f;--fg:#f5f5f7;--muted:#a1a1a6;--faint:#6e6e73;--surface:#2c2c2e;--border:#48484a;--control:#8e8e93;--grid:#333336;--focus:#2997ff;--link:#4ea3ff;--tag:#3cc59a;--tagbg:rgba(60,197,154,.14);--bad:#ff6b5e;--hl:rgba(255,204,0,.32);--sel:rgba(41,151,255,.16);--code:#2c2c2e;--shadow:0 10px 40px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:#1d1d1f;--fg:#f5f5f7;--muted:#a1a1a6;--faint:#6e6e73;--surface:#2c2c2e;--border:#48484a;--control:#8e8e93;--grid:#333336;--focus:#2997ff;--link:#4ea3ff;--tag:#3cc59a;--tagbg:rgba(60,197,154,.14);--bad:#ff6b5e;--hl:rgba(255,204,0,.32);--sel:rgba(41,151,255,.16);--code:#2c2c2e;--shadow:0 10px 40px rgba(0,0,0,.6);color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--sans);letter-spacing:-.011em;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;border:1px solid var(--control);background:var(--bg);border-radius:999px;padding:.2rem .75rem;min-height:2.1rem;font-size:.8125rem;white-space:nowrap;flex:none}
@media (hover:hover){.btn:hover{background:var(--surface)}}
.btn.icon{width:2.1rem;padding:0}
.btn svg{width:1rem;height:1rem;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kbd{font:600 .68rem var(--mono);color:var(--muted);border:1px solid var(--border);border-radius:.3rem;padding:0 .3rem}
.label{font:600 .7rem/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

.app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100vh;height:100dvh}
.top{display:flex;align-items:center;gap:.5rem;padding:.45rem .75rem;border-bottom:1px solid var(--border);min-width:0}
.brand{font:600 .75rem/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-decoration:none;white-space:nowrap;flex:none}
.brand:hover{text-decoration:underline}
.tabstrip{display:flex;align-items:center;gap:.3rem;flex:1;min-width:0;overflow-x:auto;scrollbar-width:thin;padding:.1rem}
.tab{display:inline-flex;align-items:center;flex:none;max-width:14rem;border:1px solid var(--control);border-radius:999px;background:var(--bg);font-size:.8125rem;min-height:2.1rem}
.tab.active{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tab .name{border:0;background:none;padding:.2rem .15rem .2rem .75rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:11rem;min-height:2rem}
.tab .close{border:0;background:none;width:1.9rem;min-height:2rem;border-radius:999px;opacity:.65;font-size:1rem;line-height:1}
.tab .close:hover{opacity:1}
.tab input{border:0;background:transparent;width:9rem;padding:.2rem .5rem .2rem .75rem;font-size:.8125rem;outline:none}
.tab.pinned .name::after{content:"";}
.only-narrow{display:none}

.panes{display:grid;grid-template-columns:minmax(12rem,16rem) minmax(0,1fr) minmax(12rem,16rem);min-height:0}
.side,.right{overflow:auto;padding:.75rem .75rem 2rem;min-width:0;background:var(--bg)}
.side{border-right:1px solid var(--border)}
.right{border-left:1px solid var(--border)}
.side h2,.right h2{font:600 .7rem/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:.25rem 0 .4rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.side h2 label{font:500 .72rem var(--sans);letter-spacing:0;text-transform:none;display:inline-flex;gap:.3rem;align-items:center;cursor:pointer}
.tree,.tree ul,.outline,.outline ul,.backlinks{list-style:none;margin:0;padding:0}
.tree ul,.outline ul{padding-left:.85rem}
.tree li>div{display:flex;align-items:flex-start;gap:.1rem;min-width:0}
.tree a,.outline a,.backlinks a{display:block;color:inherit;text-decoration:none;font-size:.84rem;line-height:1.35;padding:.22rem .4rem;border-radius:.35rem;overflow-wrap:anywhere;flex:1;min-width:0}
.tree a:hover,.outline a:hover,.backlinks a:hover{background:var(--surface)}
.tree a.sel{background:var(--sel);font-weight:600}
.tree a.intro{font-style:italic;color:var(--muted)}
.caret{flex:none;width:1.3rem;height:1.6rem;border:0;background:none;padding:0;color:var(--muted);font-size:.85rem;border-radius:.3rem}
.caret-pad{flex:none;width:1.3rem}
.tree li.closed>ul{display:none}
.tags{display:flex;flex-wrap:wrap;gap:.3rem;margin:.3rem 0 1rem}
.backlinks small{display:block;color:var(--muted);font:.68rem/1.3 var(--mono);letter-spacing:.02em}
.empty{color:var(--muted);font-size:.84rem;margin:.2rem .4rem}
.right section+section{margin-top:1.25rem}

.reader{overflow:auto;min-width:0;padding:1.25rem clamp(1rem,4vw,3rem) 4rem;scroll-padding-top:1rem}
.doc{max-width:46rem;margin:0 auto;overflow-wrap:break-word}
.crumbs{font:.75rem/1.4 var(--mono);color:var(--muted);margin:0 0 .75rem;display:flex;flex-wrap:wrap;gap:.2rem .4rem}
.crumbs a{color:inherit}
.doc h1,.doc h2,.doc h3,.doc h4,.doc h5,.doc h6{line-height:1.2;letter-spacing:-.02em;margin:1.6rem 0 .6rem}
.doc>:first-child,.doc .body>:first-child{margin-top:0}
.doc h1{font-size:clamp(1.7rem,4vw,2.3rem);letter-spacing:-.035em}
.doc h2{font-size:1.45rem}
.doc h3{font-size:1.18rem}
.doc h4,.doc h5,.doc h6{font-size:1rem}
.doc p,.doc li{max-width:72ch}
.doc a{color:var(--link);text-underline-offset:.18em}
.doc a.ext::after{content:"↗";font-size:.75em;margin-left:.1em;text-decoration:none;display:inline-block}
.doc a.broken{color:var(--bad);text-decoration:underline wavy;text-decoration-thickness:1px;cursor:help}
.doc .blocked,.doc .img-alt{border-bottom:1px dashed var(--faint);cursor:help}
.doc .img-alt::before{content:"🖼 ";}
a.tag{display:inline-block;color:var(--tag);background:var(--tagbg);border-radius:999px;padding:0 .45rem;font-size:.86em;text-decoration:none;line-height:1.6;white-space:nowrap}
a.tag:hover{text-decoration:underline}
a.tag .n{color:var(--muted);margin-left:.25rem;font-size:.9em}
.doc code{font:.86em var(--mono);background:var(--code);border-radius:.3rem;padding:.08em .3em}
.doc pre{margin:0;overflow:auto;padding:.8rem .9rem;font:.82rem/1.5 var(--mono)}
.doc pre code{background:none;padding:0;font-size:inherit}
.codeblock{position:relative;background:var(--code);border-radius:var(--r);margin:1rem 0}
.codeblock .copy{position:absolute;top:.35rem;right:.35rem;border:1px solid var(--control);background:var(--bg);border-radius:999px;font-size:.72rem;padding:.1rem .6rem;min-height:1.7rem}
.codeblock .lang{position:absolute;top:.5rem;right:4.5rem;font:.68rem var(--mono);color:var(--muted)}
pre.raw-html{background:none;border:1px dashed var(--border);border-radius:var(--r);white-space:pre-wrap;color:var(--muted);margin:1rem 0}
code.raw-html{color:var(--muted)}
.doc blockquote{margin:1rem 0;padding:.1rem 1rem;border-left:3px solid var(--border);color:var(--muted)}
.doc img{max-width:100%;height:auto}
.doc hr{border:0;border-top:1px solid var(--border);margin:2rem 0}
.tablewrap{overflow-x:auto;max-width:100%;margin:1rem 0;-webkit-overflow-scrolling:touch}
.doc table{border-collapse:collapse;font-size:.9rem}
.doc th,.doc td{padding:.35rem .6rem;border:1px solid var(--grid);text-align:left;vertical-align:top}
.doc th{background:var(--surface)}
.doc li>input[type="checkbox"]{margin:0 .35rem 0 0;vertical-align:-.1em}
.doc ul:has(>li>input[type="checkbox"]){list-style:none;padding-left:1.1rem}
.flash{background:var(--hl);border-radius:.2rem;box-shadow:0 0 0 .15rem var(--hl)}
mark.flash{color:inherit}
.more{color:var(--muted);font-size:.84rem;margin-top:2rem}
.tagview h1{font-size:clamp(1.6rem,4vw,2.1rem);letter-spacing:-.03em;margin:0 0 1rem}
.tagview h2{font:600 .72rem/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:1.5rem 0 .4rem}
.hits{list-style:none;margin:0;padding:0}
.hits li a{display:block;padding:.5rem .6rem;border-radius:var(--r);color:inherit;text-decoration:none;border:1px solid transparent}
.hits li a:hover{background:var(--surface)}
.hits b{display:block;font-size:.95rem}
.hits .snip{display:block;font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}
.hits mark,.results mark{background:var(--hl);color:inherit;border-radius:.15rem}
.placeholder{color:var(--muted);max-width:40rem;margin:3rem auto;text-align:center}

.drawer{border-top:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column;min-height:0}
.drawerbar{display:flex;align-items:center;gap:.5rem;padding:.35rem .75rem;min-width:0}
.drawerbar .toggle{border:0;background:none;display:inline-flex;align-items:center;gap:.4rem;padding:.25rem .2rem;min-height:2rem;min-width:0;font-size:.84rem;text-align:left}
.drawerbar .toggle span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawerbar .chev{display:inline-block;transition:transform .15s;flex:none}
.drawer.open .chev{transform:rotate(180deg)}
.drawerbar .spacer{flex:1}
.status{font:.72rem var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status.bad{color:var(--bad)}
.drawer textarea{display:none;border:0;border-top:1px solid var(--grid);background:var(--bg);width:100%;height:min(36vh,22rem);min-height:6rem;max-height:70vh;resize:vertical;padding:.7rem .9rem;font:.84rem/1.5 var(--mono);tab-size:2;outline:none}
.drawer.open textarea{display:block}
.drawer textarea:focus-visible{box-shadow:inset 0 0 0 2px var(--focus)}

.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
.palette-wrap{position:fixed;inset:0;z-index:40;display:none;align-items:flex-start;justify-content:center;padding:10vh 1rem 1rem;background:rgba(0,0,0,.3)}
.palette-wrap.open{display:flex}
.palette{width:min(40rem,100%);max-height:75vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--border);border-radius:.8rem;box-shadow:var(--shadow);overflow:hidden}
.palette .q{display:flex;gap:.5rem;align-items:center;padding:.5rem .75rem;border-bottom:1px solid var(--border)}
.palette input[type="search"]{flex:1;min-width:0;border:0;background:none;font-size:1rem;padding:.4rem 0;outline:none}
.palette .scope{font-size:.78rem;display:inline-flex;gap:.3rem;align-items:center;white-space:nowrap;color:var(--muted);cursor:pointer}
.results{overflow:auto;padding:.3rem;margin:0}
.results .group{font:600 .68rem/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:.6rem .5rem .2rem;list-style:none}
.results .hit{list-style:none;display:flex;gap:.6rem;align-items:baseline;padding:.4rem .5rem;border-radius:.45rem;cursor:pointer;min-width:0}
.results .hit[aria-selected="true"]{background:var(--sel)}
.results .type{flex:none;width:3.6rem;font:600 .62rem var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.results .body{min-width:0;flex:1}
.results .t{display:block;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.results .s{display:block;font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.palette .foot{border-top:1px solid var(--border);padding:.35rem .75rem;font-size:.72rem;color:var(--muted);display:flex;gap:.8rem;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:1.25rem;transform:translateX(-50%);z-index:50;display:none;align-items:center;gap:.8rem;background:var(--fg);color:var(--bg);border-radius:999px;padding:.45rem .6rem .45rem 1rem;font-size:.875rem;box-shadow:var(--shadow);max-width:calc(100% - 2rem)}
.toast.show{display:flex}
.toast button{border:0;border-radius:999px;background:var(--bg);color:var(--fg);padding:.2rem .8rem;font-weight:600;min-height:1.9rem}
.dropzone{position:fixed;inset:.75rem;z-index:45;border:2px dashed var(--focus);border-radius:1rem;background:color-mix(in srgb,var(--bg) 85%,transparent);display:none;align-items:center;justify-content:center;font-size:1.1rem;pointer-events:none}
.dropzone.show{display:flex}

@media (max-width:60rem){.panes{grid-template-columns:minmax(11rem,14rem) minmax(0,1fr) minmax(11rem,14rem)}}
/* Phones: the sidebar and right panel become drawers opened from the top bar;
   the right panel starts closed. */
@media (max-width:48rem){
  .only-narrow{display:inline-flex}
  .brand{display:none}
  .top{gap:.35rem;padding:.4rem .5rem}
  .panes{grid-template-columns:minmax(0,1fr)}
  .side,.right{position:fixed;top:0;bottom:0;z-index:30;width:min(85vw,20rem);box-shadow:var(--shadow);transition:transform .2s;visibility:hidden}
  .side{left:0;transform:translateX(-100%)}
  .right{right:0;transform:translateX(100%)}
  body.show-side .side,body.show-right .right{transform:none;visibility:visible}
  body.show-side .backdrop,body.show-right .backdrop{display:block}
  .reader{padding:1rem 1rem 3rem}
  .kbd.wide{display:none}
  .palette-wrap{padding:.5rem}
  .palette{max-height:calc(100dvh - 1rem)}
  .drawer textarea{height:32vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media print{.top,.side,.right,.drawer{display:none}.app{display:block;height:auto}body{overflow:visible}.reader{overflow:visible}}
</style>

<div class="app">
  <header class="top">
    <button type="button" class="btn icon only-narrow" id="open-side" aria-label="Sections and tags" aria-controls="side" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
    <a class="brand" href="../../visuals.html" title="Back to Visuals">Visuals</a>
    <nav class="tabstrip" id="tabstrip" aria-label="Tabs"></nav>
    <button type="button" class="btn icon" id="add-tab" aria-label="New tab" title="New tab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button type="button" class="btn" id="search-btn" aria-label="Search" title="Search (Ctrl/Cmd+K or /)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><span class="kbd wide" id="search-kbd">Ctrl K</span></button>
    <button type="button" class="btn icon only-narrow" id="open-right" aria-label="Outline and backlinks" aria-controls="right" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
    <button type="button" class="btn icon" id="theme-btn" aria-label="Toggle light or dark theme" title="Toggle theme"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
  </header>
  <div class="panes">
    <aside class="side" id="side" aria-label="Sections and tags">
      <h2>Sections</h2>
      <ul class="tree" id="tree"></ul>
      <h2 style="margin-top:1.25rem">Tags <label><input type="checkbox" id="tags-all"> All tabs</label></h2>
      <div class="tags" id="tags"></div>
    </aside>
    <main class="reader" id="reader" tabindex="-1"><div class="doc" id="doc"></div></main>
    <aside class="right" id="right" aria-label="Outline and backlinks">
      <section><h2>Outline</h2><ul class="outline" id="outline"></ul></section>
      <section><h2>Backlinks</h2><ul class="backlinks" id="backlinks"></ul></section>
    </aside>
  </div>
  <section class="drawer" id="drawer" aria-label="Editor">
    <div class="drawerbar">
      <button type="button" class="toggle" id="drawer-toggle" aria-expanded="false" aria-controls="editor"><span class="chev" aria-hidden="true">▴</span><span id="drawer-title">Edit markdown</span></button>
      <span class="spacer"></span>
      <span class="status" id="status" role="status"></span>
      <button type="button" class="btn" id="clear-all" title="Delete every tab and saved state">Clear all</button>
    </div>
    <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Markdown source of the active tab" placeholder="Type or paste markdown here, or drop .md files anywhere on the page."></textarea>
  </section>
</div>
<div class="backdrop" id="backdrop"></div>
<div class="palette-wrap" id="palette-wrap">
  <div class="palette" role="dialog" aria-modal="true" aria-label="Search">
    <div class="q">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      <input type="search" id="q" placeholder="Search titles, headings, #tags and text" autocomplete="off" spellcheck="false" aria-controls="results" aria-autocomplete="list" role="combobox" aria-expanded="true">
      <label class="scope"><input type="checkbox" id="q-scope"> This tab</label>
    </div>
    <ul class="results" id="results" role="listbox" aria-label="Results"></ul>
    <div class="foot"><span><span class="kbd">↑</span> <span class="kbd">↓</span> move</span><span><span class="kbd">Enter</span> open</span><span><span class="kbd">Esc</span> close</span><span id="q-count"></span></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-msg"></span><button type="button" id="toast-action" hidden>Undo</button></div>

  if (slug !== S.sel) { S.sel = slug; if (slug !== null) setHash({ kind: "tab", tabId: t.id, slug }, true); }
  renderAll({ scroll: "keep" });
}
el.editor.addEventListener("keydown", (e) => {
  // The Tab key inserts two spaces (execCommand keeps native undo; fallback without it).
  if (e.key === "Tab" && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) {
    e.preventDefault();
    let done = false;
    try { done = document.execCommand("insertText", false, "  "); } catch (err) { done = false; }
    if (!done) { el.editor.setRangeText("  ", el.editor.selectionStart, el.editor.selectionEnd, "end"); el.editor.dispatchEvent(new Event("input")); }
  }
});

function setDrawer(open) {
  S.drawerOpen = open;
  el.drawer.classList.toggle("open", open);
  el["drawer-toggle"].setAttribute("aria-expanded", String(open));
}
el["drawer-toggle"].addEventListener("click", () => { setDrawer(!S.drawerOpen); if (S.drawerOpen) el.editor.focus(); });

/* ---------- tabs ---------- */
function addTab(content, name, focus) {
  flushEdit();
  const t = newTab(content, name);
  S.tabs.push(t);
  parseTab(t);
  navigate({ kind: "tab", tabId: t.id, slug: C.firstSlug(docOf(t.id)) });
  scheduleSave();
  if (focus) { setDrawer(true); el.editor.focus(); }
  return t;
}
el["add-tab"].addEventListener("click", () => addTab("", "", true));

let undo = null;
function closeTab(id) {
  flushEdit();
  const i = S.tabs.findIndex((t) => t.id === id);
  if (i < 0) return;
  const name = titleOf(S.tabs[i]);
  const [t] = S.tabs.splice(i, 1);
  const wasActive = S.active === id;
  S.docs.delete(id); S.indexes.delete(id); S.world = null;
  S.links.refresh(world(), id);
  undo = { tab: t, index: i, wasActive };
  // With no tabs left, the demo comes back (Undo still restores the closed tab).
  if (!S.tabs.length) loadDemo();
  if (wasActive) {
    const next = S.tabs[Math.min(i, S.tabs.length - 1)];
    switchTab(next.id);
    navigate({ kind: "tab", tabId: next.id, slug: C.firstSlug(docOf(next.id)) });
  } else renderAll({ scroll: "keep" });
  scheduleSave();
  toast(`Closed ${name}`, "Undo", () => {
    if (!undo || undo.tab !== t) return;
    S.tabs.splice(Math.min(undo.index, S.tabs.length), 0, t);
    parseTab(t);
    undo = null;
    if (wasActive) navigate({ kind: "tab", tabId: t.id, slug: C.firstSlug(docOf(t.id)) });
    else renderAll({ scroll: "keep" });
    scheduleSave();
  });
}

el.tabstrip.addEventListener("click", (e) => {
  const tab = e.target.closest(".tab");
  if (!tab) return;
  const id = tab.dataset.id;
  if (e.target.closest(".close")) { closeTab(id); return; }
  if (e.target.closest(".name") && id !== S.active) {
    const doc = docOf(id);
    navigate({ kind: "tab", tabId: id, slug: C.firstSlug(doc) });
  }
});
// Double-click renames; a manual name pins it. An empty name unpins (back to the first H1).
el.tabstrip.addEventListener("dblclick", (e) => {
  const tabEl = e.target.closest(".tab");
  if (!tabEl || e.target.closest(".close")) return;
  const t = tabById(tabEl.dataset.id);
  if (!t) return;
  const input = document.createElement("input");
  input.value = titleOf(t);
  input.setAttribute("aria-label", "Tab name");
  const nameBtn = tabEl.querySelector(".name");
  nameBtn.replaceWith(input);
  input.focus(); input.select();
  let finished = false;
  const finish = (commit) => {
    if (finished) return;
    finished = true;
    if (commit) {
      const v = input.value.trim();
      if (v) { t.name = v; t.pinned = true; } else { t.name = ""; t.pinned = false; if (!t.untitled) t.untitled = C.nextUntitled(S.tabs.filter((x) => x.untitled)); }
      reindexTitle(t);
      scheduleSave();
    }
    renderAll({ scroll: "keep" });
  };
  input.addEventListener("keydown", (ev) => { if (ev.key === "Enter") { ev.preventDefault(); finish(true); } else if (ev.key === "Escape") { ev.preventDefault(); ev.stopPropagation(); finish(false); } });
  input.addEventListener("blur", () => finish(true));
});

/* ---------- drop .md files ---------- */
let dragDepth = 0;
const hasFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files");
addEventListener("dragenter", (e) => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; el.dropzone.classList.add("show"); });
addEventListener("dragover", (e) => { if (!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = "copy"; });
addEventListener("dragleave", (e) => { if (!hasFiles(e)) return; if (--dragDepth <= 0) { dragDepth = 0; el.dropzone.classList.remove("show"); } });
addEventListener("drop", async (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0; el.dropzone.classList.remove("show");
  const files = Array.from(e.dataTransfer.files || []);
  const md = files.filter((f) => /\.(md|markdown)$/i.test(f.name));
  if (!md.length) { toast("Only .md files can be opened"); return; }
  let last = null;
  for (const f of md) {
    let text = "";
    try { text = await f.text(); } catch (err) { toast(`Could not read ${f.name}`); continue; }
    const t = newTab(text, f.name);
    S.tabs.push(t);
    parseTab(t);
    last = t;
  }
  if (last) { scheduleSave(); navigate({ kind: "tab", tabId: last.id, slug: C.firstSlug(docOf(last.id)) }); }
  if (md.length < files.length) toast(`Skipped ${files.length - md.length} file(s) that are not .md`);
});

/* ---------- sidebar, reader and panels ---------- */
el.tree.addEventListener("click", (e) => {
  const c = e.target.closest(".caret");
  if (!c) return;
  const set = S.collapsed.get(S.active) || new Set();
  S.collapsed.set(S.active, set);
  const slug = c.dataset.slug;
  if (set.has(slug)) set.delete(slug); else set.add(slug);
  const li = c.closest("li");
  const closed = set.has(slug);
  li.classList.toggle("closed", closed);
  c.textContent = closed ? "▸" : "▾";
  c.setAttribute("aria-expanded", String(!closed));
});
el["tags-all"].addEventListener("change", renderTagList);
el.reader.addEventListener("click", (e) => {
  const b = e.target.closest(".copy");
  if (b) { copyCode(b); return; }
  const a = e.target.closest("a.broken");
  if (a) e.preventDefault();
});
function copyCode(btn) {
  const code = btn.parentElement.querySelector("code");
  const text = code ? code.textContent : "";
  const done = (ok) => { btn.textContent = ok ? "Copied" : "Copy failed"; setTimeout(() => { btn.textContent = "Copy"; }, 1500); };
  const fallback = () => {
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand("copy");
      ta.remove(); done(ok);
    } catch (err) { done(false); }
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => done(true), fallback);
    else fallback();
  } catch (err) { fallback(); }
}

/* ---------- phone drawers ---------- */
function closeOverlays() {
  document.body.classList.remove("show-side", "show-right");
  el["open-side"].setAttribute("aria-expanded", "false");
  el["open-right"].setAttribute("aria-expanded", "false");
}
function toggleOverlay(which) {
  const cls = "show-" + which;
  const open = !document.body.classList.contains(cls);
  closeOverlays();
  if (open) { document.body.classList.add(cls); el["open-" + which].setAttribute("aria-expanded", "true"); }
}
el["open-side"].addEventListener("click", () => toggleOverlay("side"));
el["open-right"].addEventListener("click", () => toggleOverlay("right"));
el.backdrop.addEventListener("click", closeOverlays);

/* ---------- toast ---------- */
let toastTimer = 0, toastFn = null;
function toast(msg, action, fn) {
  el["toast-msg"].textContent = msg;
  el["toast-action"].hidden = !action;
  el["toast-action"].textContent = action || "";
  toastFn = fn || null;
  el.toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.toast.classList.remove("show"); toastFn = null; }, 5000);
}
el["toast-action"].addEventListener("click", () => { const f = toastFn; toastFn = null; el.toast.classList.remove("show"); clearTimeout(toastTimer); if (f) f(); });

/* ---------- clear all ---------- */
el["clear-all"].addEventListener("click", () => {
  let ok = false;
  try { ok = confirm("Delete every tab and all saved state? This cannot be undone."); } catch (e) { ok = false; }
  if (!ok) return;
  store.del(KEY);
  editDirty = false; clearTimeout(parseTimer); parseTimer = 0;
  S.tabs = []; S.docs.clear(); S.indexes.clear(); S.links = C.makeBacklinks(); S.collapsed.clear(); S.world = null; S.seq = 0; undo = null;
  loadDemo();
  el.editor.value = activeTab().content;
  setDrawer(false);
  navigate({ kind: "tab", tabId: S.active, slug: C.firstSlug(docOf(S.active)) });
  scheduleSave();
});

/* ---------- theme ---------- */
function systemDark() { try { return matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) { return false; } }
function applyTheme(t) {
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
}
el["theme-btn"].addEventListener("click", () => {
  // The toggle flips whatever is showing and saves the choice as an override.
  const cur = document.documentElement.getAttribute("data-theme") || (systemDark() ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  applyTheme(next);
  store.set(THEME_KEY, next);
});

/* ---------- search palette ---------- */
const P = { hits: [], sel: 0, timer: 0 };
function openPalette() {
  closeOverlays();
  el["palette-wrap"].classList.add("open");
  el.q.focus(); el.q.select();
  runSearch();
}
function closePalette() {
  el["palette-wrap"].classList.remove("open");
}
const paletteOpen = () => el["palette-wrap"].classList.contains("open");
function runSearch() {
  const q = el.q.value;
  const groups = C.groupHits(C.search(S.indexes, q, { tabId: el["q-scope"].checked ? S.active : null }));
  // Arrow keys follow the grouped display order.
  P.hits = groups.flatMap((g) => g.hits);
  P.sel = 0;
  P.query = q.trim();
  const html = [];
  for (const g of groups) {
    const t = tabById(g.tabId);
    html.push(`<li class="group" role="presentation">${esc(t ? titleOf(t) : g.tabId)}</li>`);
    for (const h of g.hits) {
      const idx = P.hits.indexOf(h);
      const title = h.type === "text" || h.type === "tag" ? `<span class="t">${esc(h.title || "Intro")}</span><span class="s">${segs(h.snippet)}</span>` : `<span class="t">${segs(h.snippet)}</span>`;
      html.push(`<li class="hit" role="option" id="hit-${idx}" data-i="${idx}" aria-selected="${idx === 0}"><span class="type">${h.type}</span><span class="body">${title}</span></li>`);
    }
  }
  el.results.innerHTML = html.join("") || (q.trim() ? '<li class="group" role="presentation">No matches</li>' : '<li class="group" role="presentation">Type to search every tab</li>');
  el["q-count"].textContent = P.hits.length ? `${P.hits.length}${P.hits.length >= 60 ? "+" : ""} result${P.hits.length === 1 ? "" : "s"}` : "";
  markSel();
}
function markSel() {
  for (const li of el.results.querySelectorAll(".hit")) li.setAttribute("aria-selected", String(+li.dataset.i === P.sel));
  const cur = el.results.querySelector(`.hit[data-i="${P.sel}"]`);
  if (cur) { cur.scrollIntoView({ block: "nearest" }); el.q.setAttribute("aria-activedescendant", cur.id); }
  else el.q.removeAttribute("aria-activedescendant");
}
function openHit(h) {
  if (!h) return;
  closePalette();
  S.highlight = { type: h.type, match: h.type === "text" ? (h.match || P.query) : h.type === "tag" ? h.snippet.map((s) => s.t).join("") : "" };
  navigate({ kind: "tab", tabId: h.tabId, slug: h.slug });
}
el.q.addEventListener("input", () => { clearTimeout(P.timer); P.timer = setTimeout(runSearch, 90); });
el["q-scope"].addEventListener("change", runSearch);
el.q.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { e.preventDefault(); if (P.hits.length) { P.sel = (P.sel + 1) % P.hits.length; markSel(); } }
  else if (e.key === "ArrowUp") { e.preventDefault(); if (P.hits.length) { P.sel = (P.sel - 1 + P.hits.length) % P.hits.length; markSel(); } }
  else if (e.key === "Enter") {
    e.preventDefault();
    clearTimeout(P.timer);
    if (P.query !== el.q.value.trim()) runSearch(); // Enter before the debounce fires
    openHit(P.hits[P.sel]);
  }
});
el.results.addEventListener("click", (e) => { const li = e.target.closest(".hit"); if (li) openHit(P.hits[+li.dataset.i]); });
el["palette-wrap"].addEventListener("mousedown", (e) => { if (e.target === el["palette-wrap"]) closePalette(); });
el["search-btn"].addEventListener("click", openPalette);

/* ---------- keyboard ---------- */
const isField = (t) => t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable);
addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && (e.key === "k" || e.key === "K")) {
    e.preventDefault();
    if (paletteOpen()) closePalette(); else openPalette();
    return;
  }
  if (e.key === "Escape") {
    if (paletteOpen()) { e.preventDefault(); closePalette(); return; }
    if (document.body.classList.contains("show-side") || document.body.classList.contains("show-right")) { e.preventDefault(); closeOverlays(); }
    return;
  }
  if (isField(e.target) || paletteOpen()) return;
  if (e.key === "/" && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); openPalette(); return; }
  if (e.altKey && !e.ctrlKey && !e.metaKey && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
    e.preventDefault();
    if (e.key === "ArrowLeft") history.back(); else history.forward();
  }
});
addEventListener("hashchange", applyRoute);
addEventListener("pagehide", () => { clearTimeout(saveTimer); save(); });

/* ---------- WebMCP tools ---------- */
function registerTools() {
  const mc = (typeof document !== "undefined" && document.modelContext) || (typeof navigator !== "undefined" && navigator.modelContext);
  if (!mc) return;
  const out = (obj) => ({ content: [{ type: "text", text: JSON.stringify(obj) }] });
  const empty = { type: "object", properties: {}, additionalProperties: false };
  const ro = { readOnlyHint: true };
  mc.registerTool({ name: "get_metadata", description: "Return the scope, parser version and licence, routes and storage of this Markdown Explorer.", inputSchema: empty, annotations: ro, async execute() { return out(C.META); } });
  mc.registerTool({ name: "list_tabs", description: "List the open tabs: id, title, pinned name, size in characters, section count and tags, and which tab and section are selected.", inputSchema: empty, annotations: ro, async execute() {
    flushEdit();
    return out({ active: S.active, selected: S.sel, view: S.view, tabs: S.tabs.map((t) => { const d = docOf(t.id); return { id: t.id, title: titleOf(t), pinned: t.pinned, chars: t.content.length, sections: d ? d.nodes.length : 0, tags: d ? C.tagCounts([d]).map((x) => x[0]) : [] }; }) });
  } });
  mc.registerTool({ name: "get_outline", description: "Return the section tree of one tab (default: the active tab): slugs, titles, depths and tags.", inputSchema: { type: "object", properties: { tabId: { type: "string", description: "Tab id such as t1; see list_tabs." } }, additionalProperties: false }, annotations: ro, async execute(input) {
    const id = (input && input.tabId) || S.active;
    const d = docOf(id);
    return out(d ? { tabId: id, outline: C.outline(d) } : { error: `No tab ${id}` });
  } });
  mc.registerTool({ name: "search_notes", description: "Search tab titles, headings, #tags and full text across the open tabs, ranked as in the Ctrl/Cmd+K palette.", inputSchema: { type: "object", properties: { query: { type: "string" }, tabId: { type: "string", description: "Optional: limit to one tab." } }, required: ["query"], additionalProperties: false }, annotations: ro, async execute(input) {
    const hits = C.search(S.indexes, (input && input.query) || "", { tabId: input && input.tabId });
    return out(hits.map((h) => ({ tabId: h.tabId, type: h.type, slug: h.slug, title: h.title, route: C.formatRoute({ kind: "tab", tabId: h.tabId, slug: h.slug }), snippet: h.snippet.map((s) => s.t).join("") })));
  } });
  mc.registerTool({ name: "analyze_markdown", description: "Parse a markdown string without changing the page: its section tree with GitHub-style slugs, tags per section, and the links in each section with how they resolve on their own.", inputSchema: { type: "object", properties: { markdown: { type: "string" } }, required: ["markdown"], additionalProperties: false }, annotations: ro, async execute(input) {
    const d = C.parseDoc((input && input.markdown) || "");
    const w = { tabs: [{ id: "x", title: "input", linkName: null, doc: d }] };
    return out({ h1: d.h1, outline: C.outline(d), links: d.nodes.flatMap((n) => n.links.map((href) => ({ from: n.slug, href, resolved: C.resolveLink(w, "x", href) }))) });
  } });
}

/* ---------- start ---------- */
function start() {
  applyTheme(store.get(THEME_KEY));
  if (/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || "")) el["search-kbd"].textContent = "⌘K";
  if (!restore()) loadDemo();
  const t = activeTab();
  el.editor.value = t ? t.content : "";
  setDrawer(!!t && !t.content);
  if (!store.ok) setStatus("Storage unavailable: changes will not be saved", true);
  applyRoute();
  registerTools();
}
start();
})();
</script>
</body>
</html>
