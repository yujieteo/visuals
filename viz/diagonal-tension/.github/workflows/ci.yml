# CI for Diagonal Tension. This repository is where the tool and its tests develop; the site's
# visuals/diagonal-tension/ is a port of the page files and runs none of these tests. There is no
# build script and no Python test: one step type-checks the JavaScript (tsc, pinned in package.json, over the
# page's inline scripts and the tests), the other runs every tests/*.test.mjs and tests/*.test.cjs.
# tests/diagonal-tension-page.test.mjs drives the runner's preinstalled Google Chrome headless over the
# DevTools protocol, so it needs no install step; it fails rather than skips when CI finds no Chrome.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Type-check JavaScript
        run: npm ci && npm run typecheck
      - run: node --test 'tests/*.test.{mjs,cjs}'
