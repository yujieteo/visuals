# CI for the standalone sg-covid-hindsight repository: this is where the visualisation and its tests develop.
# yujieteo/site carries a port of the page files (visuals/singapore-covid-governance-hindsight/) and runs none of these tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test 'tests/*.test.{mjs,cjs}'
