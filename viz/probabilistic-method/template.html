<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Probabilistic Method Atlas — Yu Jie Teo</title>
<meta name="description" content="A visual laboratory for the probabilistic method: random objects, the quantities we control, the inequalities that turn probability into existence, and narrated beamdswitch decks for every technique.">
<link rel="canonical" href="https://teoyujie.org/visuals/probabilistic-method/">
<meta property="og:type" content="website">
<meta property="og:title" content="Probabilistic Method Atlas — Yu Jie Teo">
<meta property="og:description" content="Watch random objects become deterministic existence proofs: first moment, Local Lemma, concentration, Janson, nibble, quasirandomness, derandomisation and more.">
<meta property="og:url" content="https://teoyujie.org/visuals/probabilistic-method/">
<script id="site-theme">try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
:root{--bg:#ffffff;--fg:#1d1d1f;--muted:#6e6e73;--faint:#a1a1a6;--surface:#f5f5f7;--border:#d2d2d7;--control:#86868b;--grid:#e8e8ed;--axis:#86868b;--focus:#0071e3;--on-focus:#ffffff;--c1:#2a78d6;--c2:#eb6834;--c3:#8a4fd8;--c4:#0f8b8d;--hl:#c43d2f;--ok:#1a7f4b;--warn:#9a6700;--bad:#c4261d;--shadow:rgb(0 0 0/.16);--sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;--math:"Cambria Math","STIX Two Math","Latin Modern Math",Cambria,"Times New Roman",serif;--fade-duration:200ms;--fade-ease:cubic-bezier(0.2,0,0,1);--panel:var(--bg);--red:var(--bad);--green:var(--ok);--yellow:var(--warn);--blue:var(--c1);--violet:var(--c3);--orange:var(--c2);--strong:var(--fg);--r:.5rem;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1d1f;--fg:#f5f5f7;--muted:#a1a1a6;--faint:#6e6e73;--surface:#2c2c2e;--border:#48484a;--control:#8e8e93;--grid:#333336;--axis:#8e8e93;--focus:#2997ff;--on-focus:#1d1d1f;--c1:#3987e5;--c2:#d95926;--c3:#a77bf0;--c4:#3bb6b8;--hl:#ff6961;--ok:#30c07a;--warn:#e3b341;--bad:#ff6961;--shadow:rgb(0 0 0/.6)}}
:root[data-theme="dark"]{--bg:#1d1d1f;--fg:#f5f5f7;--muted:#a1a1a6;--faint:#6e6e73;--surface:#2c2c2e;--border:#48484a;--control:#8e8e93;--grid:#333336;--axis:#8e8e93;--focus:#2997ff;--on-focus:#1d1d1f;--c1:#3987e5;--c2:#d95926;--c3:#a77bf0;--c4:#3bb6b8;--hl:#ff6961;--ok:#30c07a;--warn:#e3b341;--bad:#ff6961;--shadow:rgb(0 0 0/.6);color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--sans);letter-spacing:-.011em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--focus);text-underline-offset:.18em}
h1,h2,h3{color:var(--fg);margin:0}
h1{font:700 1.25rem/1.2 var(--sans);letter-spacing:-.03em}
h2{font:600 1.5rem/1.2 var(--sans);letter-spacing:-.02em}
h3{font:600 .75rem/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:1.1rem 0 .4rem}
p{margin:.4rem 0;max-width:70ch}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.m{font-family:var(--math);font-style:normal}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:.85rem}
.btn{min-height:44px;min-width:44px;padding:0 .9rem;border:1px solid var(--control);border-radius:999px;background:var(--bg);color:var(--fg);font-weight:600;font-size:.875rem}
.btn:hover{background:var(--surface)}
.btn.primary{background:var(--focus);border-color:var(--focus);color:var(--on-focus)}
.btn.quiet{background:transparent;font-weight:500;color:var(--fg)}.btn.quiet:not([aria-pressed="true"]):hover{background:var(--surface)}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn:disabled{opacity:.5;cursor:default}
/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;padding:.4rem 16px;background:var(--bg);border-bottom:1px solid var(--border)}
.top .brand{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.top .brand a{color:var(--muted);font:600 .75rem/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;text-decoration:none}.top .brand a:hover{text-decoration:underline}
.modes{display:flex;gap:.25rem;flex-wrap:wrap}
/* layout */
.shell{display:grid;grid-template-columns:15rem minmax(0,1fr) 22rem;gap:0;min-height:calc(100vh - 60px)}
.nav{border-right:1px solid var(--border);padding:.6rem .8rem 2rem;overflow:auto;max-height:calc(100vh - 60px);position:sticky;top:60px}
.nav h3{margin-top:.9rem}
.nav button{display:block;width:100%;text-align:left;min-height:36px;padding:.3rem .5rem;border:0;border-radius:var(--r);background:none;color:var(--fg);font-size:.88rem}
.nav button[aria-current="true"]{background:var(--fg);color:var(--bg);font-weight:600}
.nav button:not([aria-current="true"]):hover{background:var(--surface)}
.center{padding:1rem 1.2rem 6rem;min-width:0}
.side{border-left:1px solid var(--border);padding:1rem 1rem 6rem;min-width:0;background:var(--panel)}
.layer{border-top:1px solid var(--border);padding-top:.2rem;margin-top:1rem}
.lede{font-size:1.125rem;line-height:1.5;color:var(--fg);max-width:66ch;margin:.3rem 0 .6rem}
.four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem;margin:.6rem 0}
.four div{border:1px solid var(--border);border-radius:var(--r);padding:.5rem .6rem;background:var(--panel);min-width:0}
.four b{display:block;font:600 .75rem/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.four span{font-size:.84rem}
.stage{position:relative;border:1px solid var(--border);border-radius:var(--r);background:var(--panel);overflow:hidden}
.stage svg{display:block;width:100%;height:auto;max-height:62vh}
.stagebar{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;padding:.5rem;border-top:1px solid var(--border)}
.summary{font-size:.86rem;color:var(--muted);padding:.4rem .6rem;border-top:1px dashed var(--border)}
.controls{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.6rem 1rem;margin:.5rem 0}
.controls label{display:flex;flex-direction:column;gap:.15rem;font-size:.82rem;color:var(--muted);min-width:0}
.controls output{font-family:var(--mono);color:var(--fg)}
.controls input[type=range]{width:100%;min-height:44px;accent-color:var(--focus)}
.controls select,.field{min-height:44px;border:1px solid var(--control);border-radius:var(--r);background:var(--bg);padding:0 .5rem;max-width:100%}
.rows{width:100%;border-collapse:collapse;font-size:.86rem}
.rows td{padding:.3rem .2rem;border-bottom:1px solid var(--grid);vertical-align:top}
.rows td:last-child{text-align:right;font-family:var(--mono);color:var(--fg);white-space:nowrap}
.eq{font:1.02rem/1.5 var(--math);color:var(--fg);background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:.5rem .7rem;overflow-x:auto}
.verdict{border-radius:var(--r);padding:.6rem .7rem;margin:.6rem 0;border:1px solid var(--border);background:var(--bg)}
.verdict.ok{border-left:3px solid var(--green)}
.verdict.no{border-left:3px solid var(--red)}
.verdict b{display:block;font:600 .75rem/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.transition{display:grid;grid-template-columns:1fr auto 1fr;gap:.4rem;align-items:center;font-size:.82rem;margin:.4rem 0}
.transition span{border:1px solid var(--border);border-radius:var(--r);padding:.35rem .5rem;text-align:center;background:var(--bg)}
.transition .arrow{border:0;background:none;font:1.2rem var(--math);color:var(--fg)}
.assume{padding-left:0}.assume li{list-style:none;margin:.3rem 0;padding-left:1.5rem;text-indent:-1.5rem;font-size:.86rem}
.assume li.no{color:var(--red)}
.assume .why{display:block;text-indent:0;color:var(--fg);font-size:.82rem;margin-top:.2rem}
ol.proof{padding-left:1.3rem;margin:.3rem 0}
ol.proof li{margin:.25rem 0;font-size:.88rem}
ol.proof button{all:unset;cursor:pointer;display:block;border-radius:var(--r);padding:.2rem .3rem}
ol.proof button:focus-visible{outline:2px solid var(--focus)}
ol.proof li.active button{background:var(--surface);color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin:.3rem 0}
.chip{min-height:36px;padding:0 .7rem;border:1px solid var(--control);border-radius:999px;background:var(--bg);font-size:.875rem}.chip:not([aria-pressed="true"]):hover{background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.badge{display:inline-block;font:600 .7rem/1.5 var(--mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:0 .4rem;vertical-align:middle;color:var(--fg)}
.badge.todo{border-color:var(--orange)}.badge.done{border-color:var(--green)}.badge.exp{border-color:var(--violet)}.badge.thm{border-color:var(--blue)}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
.card{border:1px solid var(--border);border-radius:var(--r);padding:.7rem .8rem;background:var(--panel);min-width:0}
.card h4{margin:0 0 .2rem;font:600 1rem/1.3 var(--sans);color:var(--fg)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.7rem}
.cards button.card{text-align:left;color:inherit;min-height:44px}
.cards button.card:hover{border-color:var(--control);background:var(--surface)}
.bars .bar{display:grid;grid-template-columns:minmax(0,11rem) minmax(0,1fr) 5.5rem;gap:.5rem;align-items:center;font-size:.82rem;margin:.2rem 0}
.bars .track{height:10px;border:1px solid var(--border);border-radius:3px;position:relative;background:var(--bg)}
.bars .fill{position:absolute;inset:0 auto 0 0;background:var(--fg)}
.bars .fill.void{background:repeating-linear-gradient(45deg,var(--muted) 0 3px,transparent 3px 6px)}
.bars .val{font-family:var(--mono);text-align:right}
table.grid{border-collapse:collapse;width:100%;font-size:.84rem}
table.grid th,table.grid td{border-bottom:1px solid var(--grid);padding:.3rem .4rem;text-align:left;vertical-align:top}
table.grid th{color:var(--muted);font:600 .75rem/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.scroll{overflow-x:auto;max-width:100%}
.actions{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;justify-content:center;padding:.4rem 16px calc(.4rem + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--border)}
.actions .sep{width:1px;align-self:stretch;background:var(--border);margin:0 .2rem}
.menu{position:relative}
.menu [role=menu]{position:absolute;bottom:calc(100% + 6px);right:0;min-width:16rem;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:.3rem;box-shadow:0 8px 24px var(--shadow)}
.menu [role=menuitem]{display:block;width:100%;text-align:left;min-height:40px;border:0;background:none;border-radius:4px;padding:0 .6rem;font-size:.86rem}
.menu [role=menuitem]:hover,.menu [role=menuitem]:focus{background:var(--surface)}
.toast{position:fixed;left:50%;bottom:4.5rem;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:.5rem .9rem;border-radius:var(--r);font-size:.86rem;z-index:40}
/* experiment */
.exp{border:1px solid var(--border);border-radius:var(--r);padding:.6rem .7rem;background:var(--panel)}
.exp .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
.exp .two>div{border:1px solid var(--border);border-radius:var(--r);padding:.5rem;background:var(--bg);min-width:0}
.exp .two b{display:inline-block;margin-bottom:.2rem;font:600 .75rem/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase}
progress{width:100%;height:6px;accent-color:var(--focus)}
/* svg marks */
svg text{font-family:var(--sans);fill:var(--fg)}
svg .lbl{font-size:11px;fill:var(--muted)}
svg .ttl{font-size:12px;font-weight:600;fill:var(--fg)}
svg .axis{stroke:var(--axis)}
svg .ink{stroke:var(--fg)}
svg .faint{stroke:var(--grid)}
svg .red{stroke:var(--red)}svg .blue{stroke:var(--blue)}svg .green{stroke:var(--green)}
svg .fred{fill:var(--red)}svg .fblue{fill:var(--blue)}svg .fgreen{fill:var(--green)}svg .fink{fill:var(--fg)}svg .fbg{fill:var(--bg)}svg .fmuted{fill:var(--muted)}svg .fyellow{fill:var(--yellow)}
svg [tabindex]:focus-visible{outline:2px solid var(--focus)}
/* modes */
body.proof-lens .nav,body.proof-lens .secondary{display:none}
body.proof-lens .shell{grid-template-columns:minmax(0,1fr) 26rem}
body.proof-lens ol.proof li{font-size:1rem}
.deck{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.deck header,.deck footer{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;padding:.5rem 16px;border-bottom:1px solid var(--border)}
.deck footer{border-top:1px solid var(--border);border-bottom:0}
.deck .body{align-items:start;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1.2rem;padding:1rem 16px;overflow:auto}
.deck .slide h2{font-size:1.7rem;margin-bottom:.6rem}
.deck .slide{font-size:1.08rem}
.deck .step.later{visibility:hidden}
.mdisp{font:1.15rem/1.6 var(--math);color:var(--fg);text-align:center;margin:.6rem 0;overflow-x:auto}
.mdt{border-collapse:collapse;margin:.5rem 0;font-size:.95rem}.mdt td,.mdt th{border-bottom:1px solid var(--border);padding:.25rem .6rem;text-align:left}
.overlay{position:fixed;inset:0;z-index:50;background:rgb(0 0 0/.45);display:flex;align-items:flex-start;justify-content:center;padding:10vh 16px}
.dialog{width:min(40rem,100%);background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:.8rem;box-shadow:0 8px 24px var(--shadow);max-height:80vh;overflow:auto}
.dialog input{width:100%;min-height:48px;font-size:1.05rem;border:1px solid var(--control);border-radius:var(--r);background:var(--bg);padding:0 .7rem}
.results{list-style:none;padding:0;margin:.5rem 0 0}
.results button{display:block;width:100%;text-align:left;min-height:44px;border:0;background:none;border-radius:4px;padding:.3rem .5rem}
.results li[aria-selected="true"] button,.results button:hover{background:var(--surface)}
kbd{font-family:var(--mono);font-size:.8rem;border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 .3rem}
.static{max-width:60rem;margin:auto;padding:1rem 16px 3rem}
.static table{border-collapse:collapse;width:100%;font-size:.85rem}.static td,.static th{border-bottom:1px solid var(--border);padding:.25rem .4rem;text-align:left;vertical-align:top}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.nav button{transition:background-color var(--fade-duration) var(--fade-ease),border-color var(--fade-duration) var(--fade-ease)}}
@media (prefers-reduced-motion:reduce){:root{--fade-duration:0ms}}
@media print{:root:root{--bg:#ffffff;--fg:#1d1d1f;--muted:#6e6e73;--faint:#a1a1a6;--surface:#f5f5f7;--border:#d2d2d7;--control:#86868b;--grid:#e8e8ed;--axis:#86868b;--focus:#0071e3;--on-focus:#ffffff;--c1:#2a78d6;--c2:#eb6834;--c3:#8a4fd8;--c4:#0f8b8d;--hl:#c43d2f;--ok:#1a7f4b;--warn:#9a6700;--bad:#c4261d;--shadow:rgb(0 0 0/.16);color-scheme:light}}
@media (max-width:1100px){.shell{grid-template-columns:minmax(0,1fr) 20rem}.nav{display:none}.navselect{display:block!important}}
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr)}.side{border-left:0;border-top:1px solid var(--border)}
  .center,.side{padding-left:16px;padding-right:16px}
  .four{grid-template-columns:repeat(2,minmax(0,1fr))}.split,.exp .two{grid-template-columns:minmax(0,1fr)}
  .deck .body{grid-template-columns:minmax(0,1fr)}
  .bars .bar{grid-template-columns:minmax(0,1fr) 5rem}.bars .track{grid-column:1/-1;grid-row:2}
  body.proof-lens .shell{grid-template-columns:minmax(0,1fr)}
  .actions .opt{display:none}
  #open-search kbd,.top .brand a{display:none}.top .btn{min-width:40px;padding:0 .55rem}
}
.navselect{display:none;margin:.2rem 0 .6rem}
</style>
</head>
<body>
<div id="static" class="static">
<!--@STATIC@-->
</div>
<div id="app" hidden>
<header class="top">
  <div class="brand"><a href="../">teoyujie.org / visuals</a><h1>Probabilistic Method Atlas</h1></div>
  <nav class="modes" aria-label="Modes">
    <button class="btn quiet" id="mode-atlas" type="button">Atlas</button>
    <button class="btn quiet" id="mode-lab" type="button">Lab</button>
    <button class="btn quiet" id="mode-proof" type="button" aria-pressed="false" title="Proof lens (P)">Proof</button>
    <button class="btn quiet" id="mode-deck" type="button" title="Deck mode (D)">Deck</button>
  </nav>
  <button class="btn quiet" id="open-search" type="button" aria-label="Search techniques (Command K, Control K or slash)">Search <kbd>⌘K</kbd></button>
  <button class="btn quiet" id="theme" type="button" aria-label="Switch colour theme">◐</button>
  <button class="btn quiet" id="help" type="button" aria-label="Keyboard shortcuts">?</button>
</header>
<main id="main"></main>
<div class="actions" id="actions" role="toolbar" aria-label="Lab actions"></div>
<div id="live" class="sr" aria-live="polite"></div>
</div>
<script id="beamdswitch">
/*@BEAMDSWITCH@*/</script>
<script id="probabilistic-method-engine">
/*@ENGINE@*/</script>
<script id="probabilistic-method-ui">
/*@UI@*/</script>
</body>
</html>
