<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Probabilistic Method Atlas — Yu Jie Teo</title>
<meta name="description" content="A visual laboratory for the probabilistic method: random objects, the quantities we control, the inequalities that turn probability into existence, and narrated beamdswitch decks for every technique.">
<link rel="canonical" href="https://teoyujie.org/visuals/probabilistic-method/">
<meta property="og:type" content="website">
<meta property="og:title" content="Probabilistic Method Atlas — Yu Jie Teo">
<meta property="og:description" content="Watch random objects become deterministic existence proofs: first moment, Local Lemma, concentration, Janson, nibble, quasirandomness, derandomisation and more.">
<meta property="og:url" content="https://teoyujie.org/visuals/probabilistic-method/">
<style>
:root{
  --bg:#fdf6e3;--surface:#eee8d5;--panel:#fbf3dc;--fg:#4c5f66;--strong:#073642;--muted:#5d7078;--rule:#d9cfb4;--faint:#e6dec6;
  --accent:#268bd2;--on-accent:#fdf6e3;--red:#c4302b;--blue:#1f74b5;--green:#6b7d00;--yellow:#a67c00;--violet:#5f63b8;--cyan:#1f8a82;--orange:#b8460f;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --r:6px;color-scheme:light
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#002b36;--surface:#073642;--panel:#04313d;--fg:#a3b1b1;--strong:#eee8d5;--muted:#8d9d9e;--rule:#1d4b56;--faint:#0b3c48;
  --accent:#4ba3e3;--on-accent:#002b36;--red:#f0605c;--blue:#55a7e8;--green:#a4b928;--yellow:#d0a21a;--violet:#9599e8;--cyan:#3cbcb2;--orange:#e9773f;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#002b36;--surface:#073642;--panel:#04313d;--fg:#a3b1b1;--strong:#eee8d5;--muted:#8d9d9e;--rule:#1d4b56;--faint:#0b3c48;
  --accent:#4ba3e3;--on-accent:#002b36;--red:#f0605c;--blue:#55a7e8;--green:#a4b928;--yellow:#d0a21a;--violet:#9599e8;--cyan:#3cbcb2;--orange:#e9773f;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--sans);overflow-x:hidden}
a{color:var(--accent);text-underline-offset:.18em}
h1,h2,h3{color:var(--strong);margin:0}
h1{font:600 1.15rem/1.2 var(--sans);letter-spacing:-.01em}
h2{font:600 1.45rem/1.2 var(--serif)}
h3{font:700 .72rem/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:1.1rem 0 .4rem}
p{margin:.4rem 0;max-width:70ch}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.m,.math{font-family:var(--serif);font-style:normal}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:.85rem}
.btn{min-height:44px;min-width:44px;padding:0 .9rem;border:1px solid var(--rule);border-radius:var(--r);background:var(--panel);color:var(--strong);font-weight:600;font-size:.88rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.quiet{background:transparent;font-weight:500;color:var(--fg)}
.btn[aria-pressed="true"]{background:var(--strong);color:var(--bg);border-color:var(--strong)}
.btn:disabled{opacity:.5;cursor:default}
/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;padding:.4rem 16px;background:var(--bg);border-bottom:1px solid var(--rule)}
.top .brand{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.top .brand a{color:var(--muted);font-size:.75rem;text-decoration:none}
.modes{display:flex;gap:.25rem;flex-wrap:wrap}
/* layout */
.shell{display:grid;grid-template-columns:15rem minmax(0,1fr) 22rem;gap:0;min-height:calc(100vh - 60px)}
.nav{border-right:1px solid var(--rule);padding:.6rem .8rem 2rem;overflow:auto;max-height:calc(100vh - 60px);position:sticky;top:60px}
.nav h3{margin-top:.9rem}
.nav button{display:block;width:100%;text-align:left;min-height:36px;padding:.3rem .5rem;border:0;border-radius:var(--r);background:none;color:var(--fg);font-size:.88rem}
.nav button[aria-current="true"]{background:var(--surface);color:var(--strong);font-weight:600}
.nav button:hover{background:var(--faint)}
.center{padding:1rem 1.2rem 6rem;min-width:0}
.side{border-left:1px solid var(--rule);padding:1rem 1rem 6rem;min-width:0;background:var(--panel)}
.layer{border-top:1px solid var(--rule);padding-top:.2rem;margin-top:1rem}
.lede{font:1.1rem/1.45 var(--serif);color:var(--strong);margin:.3rem 0 .6rem}
.four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem;margin:.6rem 0}
.four div{border:1px solid var(--rule);border-radius:var(--r);padding:.5rem .6rem;background:var(--panel);min-width:0}
.four b{display:block;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.four span{font-size:.84rem}
.stage{position:relative;border:1px solid var(--rule);border-radius:var(--r);background:var(--panel);overflow:hidden}
.stage svg{display:block;width:100%;height:auto;max-height:62vh}
.stagebar{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;padding:.5rem;border-top:1px solid var(--rule)}
.summary{font-size:.86rem;color:var(--muted);padding:.4rem .6rem;border-top:1px dashed var(--rule)}
.controls{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.6rem 1rem;margin:.5rem 0}
.controls label{display:flex;flex-direction:column;gap:.15rem;font-size:.82rem;color:var(--muted);min-width:0}
.controls output{font-family:var(--mono);color:var(--strong)}
.controls input[type=range]{width:100%;min-height:44px;accent-color:var(--accent)}
.controls select,.field{min-height:44px;border:1px solid var(--rule);border-radius:var(--r);background:var(--bg);padding:0 .5rem;max-width:100%}
.rows{width:100%;border-collapse:collapse;font-size:.86rem}
.rows td{padding:.3rem .2rem;border-bottom:1px solid var(--faint);vertical-align:top}
.rows td:last-child{text-align:right;font-family:var(--mono);color:var(--strong);white-space:nowrap}
.eq{font:1.02rem/1.5 var(--serif);color:var(--strong);background:var(--bg);border:1px solid var(--rule);border-radius:var(--r);padding:.5rem .7rem;overflow-x:auto}
.verdict{border-radius:var(--r);padding:.6rem .7rem;margin:.6rem 0;border:1px solid var(--rule);background:var(--bg)}
.verdict.ok{border-left:4px solid var(--green)}
.verdict.no{border-left:4px solid var(--red)}
.verdict b{display:block;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.transition{display:grid;grid-template-columns:1fr auto 1fr;gap:.4rem;align-items:center;font-size:.82rem;margin:.4rem 0}
.transition span{border:1px solid var(--rule);border-radius:var(--r);padding:.35rem .5rem;text-align:center;background:var(--bg)}
.transition .arrow{border:0;background:none;font:1.2rem var(--serif);color:var(--strong)}
.assume{padding-left:0}.assume li{list-style:none;margin:.3rem 0;padding-left:1.5rem;text-indent:-1.5rem;font-size:.86rem}
.assume li.no{color:var(--red)}
.assume .why{display:block;text-indent:0;color:var(--fg);font-size:.82rem;margin-top:.2rem}
ol.proof{padding-left:1.3rem;margin:.3rem 0}
ol.proof li{margin:.25rem 0;font-size:.88rem}
ol.proof button{all:unset;cursor:pointer;display:block;border-radius:var(--r);padding:.2rem .3rem}
ol.proof button:focus-visible{outline:2px solid var(--accent)}
ol.proof li.active button{background:var(--surface);color:var(--strong)}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin:.3rem 0}
.chip{min-height:36px;padding:0 .7rem;border:1px solid var(--rule);border-radius:999px;background:var(--bg);font-size:.82rem}
.badge{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:4px;padding:0 .3rem;vertical-align:middle}
.badge.todo{color:var(--orange)}.badge.done{color:var(--green)}.badge.exp{color:var(--violet)}.badge.thm{color:var(--blue)}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
.card{border:1px solid var(--rule);border-radius:var(--r);padding:.7rem .8rem;background:var(--panel);min-width:0}
.card h4{margin:0 0 .2rem;font:600 1rem/1.3 var(--serif);color:var(--strong)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.7rem}
.cards button.card{text-align:left;color:inherit;min-height:44px}
.cards button.card:hover{border-color:var(--accent)}
.bars .bar{display:grid;grid-template-columns:minmax(0,11rem) minmax(0,1fr) 5.5rem;gap:.5rem;align-items:center;font-size:.82rem;margin:.2rem 0}
.bars .track{height:10px;border:1px solid var(--rule);border-radius:3px;position:relative;background:var(--bg)}
.bars .fill{position:absolute;inset:0 auto 0 0;background:var(--strong)}
.bars .fill.void{background:repeating-linear-gradient(45deg,var(--muted) 0 3px,transparent 3px 6px)}
.bars .val{font-family:var(--mono);text-align:right}
table.grid{border-collapse:collapse;width:100%;font-size:.84rem}
table.grid th,table.grid td{border-bottom:1px solid var(--faint);padding:.3rem .4rem;text-align:left;vertical-align:top}
table.grid th{color:var(--muted);font-weight:600;font-size:.74rem;letter-spacing:.04em;text-transform:uppercase}
.scroll{overflow-x:auto;max-width:100%}
.actions{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;justify-content:center;padding:.4rem 16px calc(.4rem + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--rule)}
.actions .sep{width:1px;align-self:stretch;background:var(--rule);margin:0 .2rem}
.menu{position:relative}
.menu [role=menu]{position:absolute;bottom:calc(100% + 6px);right:0;min-width:16rem;background:var(--bg);border:1px solid var(--rule);border-radius:var(--r);padding:.3rem;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.menu [role=menuitem]{display:block;width:100%;text-align:left;min-height:40px;border:0;background:none;border-radius:4px;padding:0 .6rem;font-size:.86rem}
.menu [role=menuitem]:hover,.menu [role=menuitem]:focus{background:var(--surface)}
.toast{position:fixed;left:50%;bottom:4.5rem;transform:translateX(-50%);background:var(--strong);color:var(--bg);padding:.5rem .9rem;border-radius:var(--r);font-size:.86rem;z-index:40}
/* experiment */
.exp{border:1px solid var(--rule);border-radius:var(--r);padding:.6rem .7rem;background:var(--panel)}
.exp .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
.exp .two>div{border:1px solid var(--rule);border-radius:var(--r);padding:.5rem;background:var(--bg);min-width:0}
.exp .two b{display:inline-block;margin-bottom:.2rem;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase}
progress{width:100%;height:6px}
/* svg marks */
svg text{font-family:var(--sans);fill:var(--fg)}
svg .lbl{font-size:11px;fill:var(--muted)}
svg .ttl{font-size:12px;font-weight:600;fill:var(--strong)}
svg .axis{stroke:var(--rule)}
svg .ink{stroke:var(--strong)}
svg .faint{stroke:var(--faint)}
svg .red{stroke:var(--red)}svg .blue{stroke:var(--blue)}svg .green{stroke:var(--green)}
svg .fred{fill:var(--red)}svg .fblue{fill:var(--blue)}svg .fgreen{fill:var(--green)}svg .fink{fill:var(--strong)}svg .fbg{fill:var(--bg)}svg .fmuted{fill:var(--muted)}svg .fyellow{fill:var(--yellow)}
svg [tabindex]:focus-visible{outline:2px solid var(--accent)}
/* modes */
body.proof-lens .nav,body.proof-lens .secondary{display:none}
body.proof-lens .shell{grid-template-columns:minmax(0,1fr) 26rem}
body.proof-lens ol.proof li{font-size:1rem}
.deck{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.deck header,.deck footer{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;padding:.5rem 16px;border-bottom:1px solid var(--rule)}
.deck footer{border-top:1px solid var(--rule);border-bottom:0}
.deck .body{align-items:start;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1.2rem;padding:1rem 16px;overflow:auto}
.deck .slide h2{font-size:1.7rem;margin-bottom:.6rem}
.deck .slide{font-size:1.08rem}
.deck .step.later{visibility:hidden}
.mdisp{font:1.15rem/1.6 var(--serif);color:var(--strong);text-align:center;margin:.6rem 0;overflow-x:auto}
.mdt{border-collapse:collapse;margin:.5rem 0;font-size:.95rem}.mdt td,.mdt th{border-bottom:1px solid var(--rule);padding:.25rem .6rem;text-align:left}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,20,26,.45);display:flex;align-items:flex-start;justify-content:center;padding:10vh 16px}
.dialog{width:min(40rem,100%);background:var(--bg);border:1px solid var(--rule);border-radius:var(--r);padding:.8rem;box-shadow:0 12px 40px rgba(0,0,0,.25);max-height:80vh;overflow:auto}
.dialog input{width:100%;min-height:48px;font-size:1.05rem;border:1px solid var(--rule);border-radius:var(--r);background:var(--panel);padding:0 .7rem}
.results{list-style:none;padding:0;margin:.5rem 0 0}
.results button{display:block;width:100%;text-align:left;min-height:44px;border:0;background:none;border-radius:4px;padding:.3rem .5rem}
.results li[aria-selected="true"] button,.results button:hover{background:var(--surface)}
kbd{font-family:var(--mono);font-size:.8rem;border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 .3rem}
.static{max-width:60rem;margin:auto;padding:1rem 16px 3rem}
.static table{border-collapse:collapse;width:100%;font-size:.85rem}.static td,.static th{border-bottom:1px solid var(--rule);padding:.25rem .4rem;text-align:left;vertical-align:top}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.nav button{transition:background-color .15s,border-color .15s}svg .anim{transition:opacity .25s}}
@media (max-width:1100px){.shell{grid-template-columns:minmax(0,1fr) 20rem}.nav{display:none}.navselect{display:block!important}}
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr)}.side{border-left:0;border-top:1px solid var(--rule)}
  .center,.side{padding-left:16px;padding-right:16px}
  .four{grid-template-columns:repeat(2,minmax(0,1fr))}.split,.exp .two{grid-template-columns:minmax(0,1fr)}
  .deck .body{grid-template-columns:minmax(0,1fr)}
  .bars .bar{grid-template-columns:minmax(0,1fr) 5rem}.bars .track{grid-column:1/-1;grid-row:2}
  body.proof-lens .shell{grid-template-columns:minmax(0,1fr)}
  .actions .opt{display:none}
  #open-search kbd,.top .brand a{display:none}.top .btn{min-width:40px;padding:0 .55rem}
}
.navselect{display:none;margin:.2rem 0 .6rem}
</style>
</head>
<body>
<div id="static" class="static">
<!--@STATIC@-->
</div>
<div id="app" hidden>
<header class="top">
  <div class="brand"><a href="../">teoyujie.org / visuals</a><h1>Probabilistic Method Atlas</h1></div>
  <nav class="modes" aria-label="Modes">
    <button class="btn quiet" id="mode-atlas" type="button">Atlas</button>
    <button class="btn quiet" id="mode-lab" type="button">Lab</button>
    <button class="btn quiet" id="mode-proof" type="button" aria-pressed="false" title="Proof lens (P)">Proof</button>
    <button class="btn quiet" id="mode-deck" type="button" title="Deck mode (D)">Deck</button>
  </nav>
  <button class="btn quiet" id="open-search" type="button" aria-label="Search techniques (Command K, Control K or slash)">Search <kbd>⌘K</kbd></button>
  <button class="btn quiet" id="theme" type="button" aria-label="Switch colour theme">◐</button>
  <button class="btn quiet" id="help" type="button" aria-label="Keyboard shortcuts">?</button>
</header>
<main id="main"></main>
<div class="actions" id="actions" role="toolbar" aria-label="Lab actions"></div>
<div id="live" class="sr" aria-live="polite"></div>
</div>
<script id="beamdswitch">
/*@BEAMDSWITCH@*/</script>
<script id="probabilistic-method-engine">
/*@ENGINE@*/</script>
<script id="probabilistic-method-ui">
/*@UI@*/</script>
</body>
</html>
