# CI for Sectionlab. This repository is where Sectionlab and its tests develop; the site's
# visuals/sectionlab/ is a port of the page files and runs none of these tests. The steps run
# every tests/*.test.mjs (beamdswitch.test.mjs, and browser.test.mjs in the runner's google-chrome,
# included) and every tests/test_*.py, including the torsion accuracy-table test in test_torsion.py.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-test.txt
      - run: python build.py --check
      - run: node --test 'tests/*.test.mjs'
      - run: python -m unittest discover -s tests -p 'test_*.py'
