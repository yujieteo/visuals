# CI for the standalone Sectionlab repository (a mirror of visuals/sectionlab/ in the
# personal site repository, where the site's own CI runs these same tests).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-test.txt
      - run: python build.py --check
      - run: node --test 'tests/*.test.mjs'
      - run: python -m unittest discover -s tests -p 'test_*.py'
