        <h1>Generating Functions Lab</h1>
        <p>Generating functions are a calculus for discrete structures. A discrete problem becomes a sequence of counts a₀, a₁, a₂, …; the sequence becomes one object A(x) = Σ aₙxⁿ; algebra, combinatorics and analysis manipulate A(x); and reading a coefficient [xⁿ]A(x) answers the original question. With JavaScript the lab makes every step interactive and checks every coefficient against a direct enumeration. This text version keeps the essentials.</p>
        <h2>Concept map</h2>
        <ul>
          <li>Sequences → ordinary generating functions (OGF): shifting, differentiation, convolution, recurrence solving, partial fractions
            <ul><li>→ rational generating functions → combinatorial constructions (composition → Lagrange inversion → trees and implicit structures; EGF → exponential formula) and asymptotic analysis</li></ul></li>
          <li>Finite generating functions (polynomials) → evaluation at roots of unity → DFT → filters and cyclic convolution</li>
          <li>Extended branch: probability generating functions, bivariate and multivariate generating functions, q-series (partitions)</li>
        </ul>
        <h2>Levels</h2>
        <ol start="0">

        <h2>Canonical formulas</h2>
        <ul>
          <li>Geometric series: 1 + x + x² + ⋯ = 1/(1 − x), so [xⁿ] 1/(1 − x) = 1 (a formal identity; convergence for |x| &lt; 1 is a separate, analytic fact).</li>
          <li>Shift: [xⁿ] xᵏA(x) = aₙ₋ₖ. Differentiation: Σ n xⁿ = x/(1 − x)².</li>
          <li>Fibonacci (F₀ = 0, F₁ = 1): F(x) − xF(x) − x²F(x) = x, so F(x) = x/(1 − x − x²) and Fₙ = (φⁿ − ψⁿ)/√5.</li>
          <li>Convolution: [xⁿ]A(x)B(x) = Σₖ aₖbₙ₋ₖ. Coin change with 1, 2, 5: [x¹²] 1/((1 − x)(1 − x²)(1 − x⁵)) = 13.</li>
          <li>Compositions with parts 1, 2, 3: 1/(1 − x − x² − x³). Binary strings with no 11: (1 + x)/(1 − x − x²).</li>
          <li>Catalan: C = 1 + xC², C(x) = (1 − √(1 − 4x))/(2x), Cₙ = C(2n, n)/(n + 1) ∼ 4ⁿ/(√π n^{3/2}).</li>
          <li>Lagrange inversion: if T = xφ(T) then [xⁿ]Tᵏ = (k/n)[uⁿ⁻ᵏ]φ(u)ⁿ.</li>
          <li>EGF product: cₙ = Σₖ C(n, k)aₖbₙ₋ₖ. Exponential formula: A(x) = exp(C(x)); permutations = SET(CYCLE), so exp(log 1/(1 − x)) = 1/(1 − x).</li>
          <li>Probability: G_{X+Y}(z) = G_X(z)G_Y(z).</li>
          <li>Roots-of-unity filter: Σ_{n ≡ r (mod m)} aₙ = (1/m) Σⱼ ω^{−rj} A(ωʲ), ω = e^{2πi/m}. Exponents 0–11 divisible by 3: 4.</li>
          <li>DFT of 1 + 2x + 3x² + 4x³ at 1, i, −1, −i: 10, −2 − 2i, −2, −2 + 2i. Inverse DFT: aₙ = (1/N) Σₖ A(ωᵏ)ω^{−kn}.</li>
          <li>Cyclic convolution theorem: DFT(a ⊛ b) = DFT(a) · DFT(b), because ℂ[x]/(xᴺ − 1) ≅ ℂᴺ.</li>
          <li>Partitions: Π 1/(1 − xᵏ); Euler: Π (1 + xᵏ) = Π 1/(1 − x²ᵏ⁻¹).</li>

        <h2>Generating functions and the DFT</h2>
        <p>A finite generating function A(x) = a₀ + a₁x + ⋯ + a_{N−1}x^{N−1} is a polynomial. Evaluating it at the N-th roots of unity 1, ω, …, ω^{N−1} (ω = e^{2πi/N}) gives N values: that change of coordinates, from coefficients to values, is the discrete Fourier transform. Reading coefficients back, aₙ = (1/N) Σₖ A(ωᵏ)ω^{−kn}, is the inverse DFT, and it is the same averaging over roots of unity as the roots-of-unity filter. Because ωᴺ = 1, evaluation cannot tell xᴺ from 1, so multiplying polynomials modulo xᴺ − 1 (cyclic convolution of coefficients) becomes multiplying values pointwise. In those coordinates, convolution becomes multiplication.</p>
