# CI for the standalone english-grammar repository: this is where the visualisation and its tests develop.
# yujieteo/visuals carries a port of the page files (viz/english-grammar/, data/english-grammar/), which yujieteo/site publishes; neither runs these tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: node --test 'tests/*.test.{mjs,cjs}'
      - run: python -m unittest discover -s tests -p 'test_*.py'
