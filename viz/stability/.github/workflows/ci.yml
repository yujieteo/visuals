# CI for the Structural Stability Visualiser. This repository is where the visualiser and its
# tests develop; the site's visuals/stability/ is a port of the page files and runs none of these
# tests. The steps run every tests/*.test.mjs (stability.test.mjs and the beamdswitch deck test,
# beamdswitch.test.mjs) and every tests/test_*.py (build reproducibility and the self-test under Node).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: node --test 'tests/*.test.mjs'
      - run: python -m unittest discover -s tests -p 'test_*.py'
