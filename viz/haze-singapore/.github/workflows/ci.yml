# CI for the standalone haze-singapore repository: this is where the visualisation and its tests develop.
# yujieteo/visuals carries a port of the page files (viz/haze-singapore/, data/haze-singapore/), which yujieteo/site publishes; neither runs these tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test 'tests/*.test.{mjs,cjs}'
