# CI for Pigeonhole → Averages. This repository is where the tool and its tests develop; the site's
# visuals/pigeonhole/ is a port of the page files and runs none of these tests. There is no build
# script and no Python test: one step runs every tests/*.test.mjs and tests/*.test.cjs, and one
# type-checks the JSDoc in index.html's own inline scripts, scripts/ and tests/ with the TypeScript pinned in package.json.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test 'tests/*.test.{mjs,cjs}'
      - name: Type-check JavaScript
        run: npm ci && npm run typecheck
