# CI for the Entropy Methods in Combinatorics Lab. This repository is where the lab and its tests
# develop; the site's visuals/entropy-combinatorics/ is a port of the page files and runs none of
# these tests. There is no Python test, so the steps check that index.html and raw.json are the
# current build of src/ and template.html, then run every tests/*.test.mjs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node build.mjs --check
      - run: node --test 'tests/*.test.mjs'
