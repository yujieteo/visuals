[package]
name = "theorem-learner"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The Theorem Learner's data builder: authoring packets, the checks of the authored learning data and raw.json"

# A crate of its own, not a member of any workspace above it.
[workspace]

[dependencies]
base64 = "=0.22.1"
chrono = { version = "=0.4.42", default-features = false, features = ["clock"] }
flate2 = { version = "=1.1.5", default-features = false, features = ["zlib"] }
# zlib built from source, so the deflate bytes do not depend on the system's zlib.
libz-sys = { version = "=1.1.22", default-features = false, features = ["static"] }
regex = "=1.12.2"
serde_json = { version = "=1.0.145", features = ["preserve_order", "float_roundtrip"] }
sha2 = "=0.10.9"

[profile.release]
debug = false
