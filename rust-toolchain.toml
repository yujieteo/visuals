# The Rust compiler for every data builder in viz/<slug>/ (a crate of its own in its folder). rustup reads
# this file from any folder below it; yujieteo/site pins the same version.
[toolchain]
channel = "1.97.0"
profile = "minimal"
# The sealed artifacts (the Cargo.toml workspace at the root) are built to WebAssembly.
targets = ["wasm32-unknown-unknown"]
