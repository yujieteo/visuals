# Copies yujieteo/site's beamdswitch report template into every visual that carries it: the one mechanical
# step a change on the site still needs here (docs/monorepo.md). Run it from the Actions tab with the site
# branch, tag or commit whose templates/beamdswitch.js to copy; a site pull request's branch works before it
# merges, which is the order the site's tests need, since they compare its template with these copies. It
# pushes the copies to a new branch, ci/beamdswitch-template-<sha256 prefix>, and its summary links the pull
# request to open, where CI checks every visual it changed.
name: Sync beamdswitch template

on:
  workflow_dispatch:
    inputs:
      site_ref:
        description: The yujieteo/site branch, tag or commit whose templates/beamdswitch.js to copy
        required: true
        default: main

permissions:
  contents: write

concurrency:
  group: sync-template

jobs:
  sync:
    name: Sync the beamdswitch template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the site's template
        env:
          SITE_REF: ${{ inputs.site_ref }}
        run: |
          case "$SITE_REF" in
            "" | -* | *[!A-Za-z0-9._/-]* | *..*) echo "not a branch, tag or commit: $SITE_REF" >&2; exit 1 ;;
          esac
          site="$RUNNER_TEMP/site"
          git init -q "$site"
          git -C "$site" fetch -q --depth 1 https://github.com/yujieteo/site.git "$SITE_REF"
          git -C "$site" show FETCH_HEAD:templates/beamdswitch.js > "$RUNNER_TEMP/beamdswitch.js"
          echo "SITE_COMMIT=$(git -C "$site" rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
      - name: Copy it into every visual that carries another
        run: python3 scripts/sync_template.py "$RUNNER_TEMP/beamdswitch.js"
      - name: Push the copies to a branch for a pull request
        env:
          SITE_REF: ${{ inputs.site_ref }}
        run: |
          if git diff --quiet; then
            echo "Every visual already carries the template of yujieteo/site $SITE_REF ($SITE_COMMIT)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="ci/beamdswitch-template-$(sha256sum "$RUNNER_TEMP/beamdswitch.js" | cut -c1-12)"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch already carries the template of yujieteo/site $SITE_REF ($SITE_COMMIT); open or update its pull request." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -qam "chore(viz): copy the beamdswitch template of yujieteo/site $SITE_REF into every visual that carries it" -m "yujieteo/site commit: $SITE_COMMIT"
          git push origin "$branch"
          echo "Copied the template of yujieteo/site $SITE_REF ($SITE_COMMIT) into $branch." >> "$GITHUB_STEP_SUMMARY"
          echo "Open the pull request: https://github.com/$GITHUB_REPOSITORY/compare/main...$branch?expand=1" >> "$GITHUB_STEP_SUMMARY"
