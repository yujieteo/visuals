name: Verify visualizations

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Every builder accepts --verify, which checks the committed data and
      # generated HTML without writing any files. The loop picks up every
      # scripts/build*.py, so a new builder needs no edit here.
      - name: Verify visualizations
        run: |
          for builder in scripts/build*.py; do python3 "$builder" --verify; done
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Set up Node for action engine regression tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test action visualization behavior
        run: node --test tests/*.test.mjs
