# CI tests only what a change touches (docs/monorepo.md). scripts/changed.py maps the diff to the visuals
# it changes, and each gets its own job on a sparse checkout of the shared tooling plus its own folder, so
# its checks cannot read another visual's folder and its failure cannot hide or fail another's. Its browser
# checks (e2e/, its e2e/) get their own job per browser project too; a change to a visual the site keeps runs
# that visual's (e2e/site/<slug>/). A change to shared tooling selects every visual, and a change to the
# browser harness every visual's browser checks and the site's own, in shards when there are too many for a
# job each. The
# repository job runs on every change: the shared tooling's tests and type check, every visual.json, and the
# generated catalogue, kept as an artifact and never committed. A daily run repeats every visual's browser
# checks, and the site's own, against new browser releases.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

# A newer push to a pull request replaces its run (its diff against the base includes the older one). Each push
# to main tests only the visuals it changed, so every one gets its own group and is never cancelled or dropped.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Changed visuals
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      slugs: ${{ steps.changed.outputs.slugs }}
      browser: ${{ steps.changed.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        name: Select the visuals the change touches
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        # A pull request checks out its merge commit, whose first parent is the base branch; a push to main
        # compares with the commit before it. workflow_dispatch, or a push without a usable before, selects all.
        run: |
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            push) base="$BEFORE" ;;
            *) base= ;;
          esac
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            python3 scripts/changed.py --base "$base" --github-output
          else
            python3 scripts/changed.py --github-output
          fi

  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      - name: Every visual.json against the schema, the folder rules, no absolute home paths
        run: python3 scripts/check_repo.py
      - name: Tests of the shared tooling
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.mjs
      # tsc checks the JSDoc types of the shared tooling (tsconfig.json), with the versions package.json pins.
      - name: Type-check the shared tooling
        run: npm ci && npm run typecheck
      # The browser checks' harness (e2e/) and every visual's e2e/ checks: tsc and the harness's own tests,
      # without a browser. The browser jobs below run the checks themselves.
      - name: Type-check and test the browser harness
        working-directory: e2e
        run: npm ci && npm run typecheck && npm run test:harness
      - name: Generate the catalogue and gallery
        run: python3 scripts/build_catalogue.py
      - uses: actions/upload-artifact@v4
        with:
          name: catalogue
          path: build/

  visual:
    name: Visual ${{ matrix.slug }}
    needs: plan
    if: github.event_name != 'schedule' && needs.plan.outputs.slugs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.plan.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Root files, the shared tooling and this visual's folder only (cone mode).
          sparse-checkout: |
            scripts
            schema
            viz/${{ matrix.slug }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the type checker
        if: hashFiles(format('viz/{0}/tsconfig.json', matrix.slug)) != ''
        run: npm ci
      - name: Check ${{ matrix.slug }}
        env:
          SLUG: ${{ matrix.slug }}
        run: python3 scripts/check.py "$SLUG" --require-typecheck

  browser:
    name: Browser ${{ matrix.job.name }} ${{ matrix.project }}
    needs: plan
    if: needs.plan.outputs.browser != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.browser) }}
        project: [chromium-desktop, firefox-desktop, webkit-desktop, chromium-mobile, webkit-mobile]
    defaults:
      run:
        working-directory: e2e
    env:
      E2E_PROJECTS: ${{ matrix.project }}
      E2E_ONLY: ${{ matrix.job.only }}
      # The one job that names no visual tests every visual the site keeps itself.
      E2E_SOURCE: ${{ matrix.job.only == '' && 'site' || '' }}
      E2E_RESULTS: results
      E2E_CONCURRENCY: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - name: Fetch yujieteo/site, for the visuals it keeps itself
        if: matrix.job.site
        run: npm run fetch-targets
      - name: Install the browser
        env:
          MATRIX_PROJECT: ${{ matrix.project }}
        run: npx playwright install --with-deps "${MATRIX_PROJECT%%-*}"
      - name: Baseline checks
        run: npm run test:baseline
      - name: Fuller checks of the visuals that have them
        run: |
          files=()
          if [ -z "$E2E_ONLY" ]; then
            files=(site/*/full.test.js)
          else
            for slug in ${E2E_ONLY//,/ }; do
              if [ -f "../viz/$slug/e2e/full.test.mjs" ]; then
                files+=("../viz/$slug/e2e/full.test.mjs")
              elif [ -f "site/$slug/full.test.js" ]; then
                files+=("site/$slug/full.test.js")
              fi
            done
          fi
          if [ ${#files[@]} -gt 0 ]; then node --test "${files[@]}"; fi
      - name: Findings and timings
        if: always()
        run: |
          node scripts/findings.js >> "$GITHUB_STEP_SUMMARY"
          node scripts/timings.js results >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results-${{ matrix.job.name }}-${{ matrix.project }}
          path: e2e/results/
          if-no-files-found: ignore

  # One stable check name for branch protection: it fails when any job above failed or was cancelled.
  passed:
    name: CI passed
    needs: [plan, repository, visual, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          REPOSITORY: ${{ needs.repository.result }}
          VISUAL: ${{ needs.visual.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          echo "plan=$PLAN repository=$REPOSITORY visual=$VISUAL browser=$BROWSER"
          ok() { [ "$1" = success ] || [ "$1" = skipped ]; }
          [ "$PLAN" = success ] && [ "$REPOSITORY" = success ] && ok "$VISUAL" && ok "$BROWSER"
